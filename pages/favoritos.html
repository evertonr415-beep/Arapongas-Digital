<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Favoritos • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:900px;margin:auto;padding:25px 16px 100px}.status,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.item h2{font-size:18px;margin:5px 0}.item p{color:var(--muted);margin:4px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:850;cursor:pointer;text-decoration:none}.open{background:#0877ff;color:#fff}.remove{background:#eef3f8;color:#28415d}.empty{text-align:center;padding:32px}.heart{font-size:45px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:850">← Início</a><span class="kicker" style="display:block;margin-top:24px">SUA CONTA</span><h1>Favoritos</h1><div class="status" id="status" role="status" aria-live="polite">Carregando seus favoritos...</div><section class="grid" id="list" aria-label="Seus favoritos"></section></main><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>(()=>{'use strict';const statusEl=document.getElementById('status'),listEl=document.getElementById('list');const uuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(v||''));function node(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}function empty(){listEl.replaceChildren();const e=node('div',null,'card empty'),h=node('div','♡','heart'),t=node('h2','Nenhum favorito ainda'),p=node('p','Quando você salvar empresas ou produtos, eles aparecerão aqui.');e.append(h,t,p);listEl.append(e)}async function details(f){try{if(uuid(f.product_id)){const r=await ArapongasDigitalAPI.productById(f.product_id),p=Array.isArray(r)?r[0]:null;if(p)return{kind:'Produto',title:p.name||'Produto',subtitle:p.business_name||'Comércio local',href:'produto.html?id='+encodeURIComponent(p.id)}}if(uuid(f.business_id)){const r=await ArapongasDigitalAPI.businessById(f.business_id),b=Array.isArray(r)?r[0]:null;if(b)return{kind:'Empresa',title:b.name||'Empresa',subtitle:b.category_name||'Comércio local',href:'empresa.html?slug='+encodeURIComponent(b.slug)}}}catch{}return null}async function remove(f,button){button.disabled=true;try{const parts=['profile_id=eq.'+encodeURIComponent(f.profile_id)];if(f.created_at)parts.push('created_at=eq.'+encodeURIComponent(f.created_at));await ArapongasDigitalAuth.dataRequest('favorites',{method:'DELETE',query:'?'+parts.join('&'),prefer:'return=minimal'});await load()}catch{button.disabled=false;statusEl.textContent='Não foi possível remover o favorito agora.'}}async function load(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next='+encodeURIComponent('favoritos.html'));return}const p=await ArapongasDigitalAuth.ensureProfile(u);if(!p?.active)throw new Error('Perfil indisponível');const rows=await ArapongasDigitalAuth.dataRequest('favorites',{query:'?select=profile_id,business_id,product_id,created_at&order=created_at.desc&limit=100'});listEl.replaceChildren();if(!Array.isArray(rows)||!rows.length){statusEl.textContent='Sua lista está vazia.';empty();return}let shown=0;for(const f of rows){if(f.profile_id!==p.id)continue;const d=await details(f);if(!d)continue;const card=node('article',null,'item'),kind=node('small',d.kind),title=node('h2',d.title),sub=node('p',d.subtitle),actions=node('div',null,'actions'),open=node('a','Abrir','btn open'),del=node('button','Remover','btn remove');open.href=d.href;del.type='button';del.addEventListener('click',()=>remove(f,del));actions.append(open,del);card.append(kind,title,sub,actions);listEl.append(card);shown++}statusEl.textContent=shown?`${shown} favorito${shown===1?'':'s'} carregado${shown===1?'':'s'}.`:'Nenhum favorito disponível.';if(!shown)empty()}catch{statusEl.textContent='Entre novamente para acessar seus favoritos.';listEl.replaceChildren();const a=node('a','Entrar na minha conta','btn open');a.href='login.html?next='+encodeURIComponent('favoritos.html');listEl.append(a)}}load()})();</script></body></html>
