<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Explorar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.explore{max-width:1120px;margin:auto;padding:24px 16px 100px}.head{background:linear-gradient(135deg,#061a44,#0a50b6);border-radius:25px;color:#fff;padding:28px}.head h1{font-size:38px;margin:6px 0}.filters{display:flex;gap:8px;overflow:auto;padding:15px 0}.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;color:#53657f;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.result .thumb{height:120px;background:#edf5ff;border-radius:14px;display:grid;place-items:center;font-size:45px;overflow:hidden}.result .thumb img{width:100%;height:100%;object-fit:cover}.result small{color:var(--muted);display:block}.result strong{display:block;font-size:20px;margin-top:8px}.result a{display:block;margin-top:12px;color:#0877ff;font-weight:850}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:20px;padding:35px;text-align:center;color:var(--muted)}@media(max-width:700px){.results{grid-template-columns:1fr 1fr}.head h1{font-size:30px}}@media(max-width:430px){.results{grid-template-columns:1fr}}</style></head><body><main class="explore"><a href="../index.html" style="color:#0877ff;font-weight:800">← Início</a><section class="head"><span class="eyebrow">BUSCA LOCAL</span><h1>Explore Arapongas</h1><p>Produtos, serviços, empresas e ofertas da cidade em um só lugar.</p><form class="search" id="searchForm"><span>⌕</span><input id="query" placeholder="Ex.: pizza, pneu, presente até R$ 200"><button>Buscar</button></form></section><div class="filters"><button data-filter="all">Tudo</button><button data-filter="offers">Em oferta</button><button data-filter="available">Disponível</button><button data-filter="low">Até R$ 50</button><button data-filter="mid">R$ 50–200</button><button data-filter="high">Acima de R$ 200</button></div><div class="heading"><div><span class="kicker">RESULTADOS</span><h2 id="resultTitle">Explore o comércio de Arapongas</h2></div></div><section class="results" id="results"><div class="empty">Digite o que procura. Os resultados vêm dos cadastros reais da plataforma.</div></section></main><script src="../js/api.js"></script><script>const CITY='249d9391-a604-4ade-8c0a-72ed98b6f261';let data=[];const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n));const E=window.ArapongasDigitalAPI.escape;function render(items){const box=document.querySelector('#results');if(!items.length){box.innerHTML='<div class="empty">Nenhum resultado cadastrado para esta busca ainda.</div>';return}box.innerHTML=items.map(p=>`<article class="result"><div class="thumb">${p.image_url?`<img src="${E(p.image_url)}" alt="">`:'📦'}</div><small>${E(p.category_name||'COMÉRCIO LOCAL')} · ${p.in_stock?'Disponível':'Consulte disponibilidade'}</small><h3>${E(p.name)}</h3><small>${E(p.business_name)}</small><strong>${p.promotional_price?money(p.promotional_price):money(p.price)}</strong><a href="produto.html?id=${encodeURIComponent(p.id)}">Ver detalhes →</a><a href="empresa.html?slug=${encodeURIComponent(p.business_slug)}">Ver empresa →</a></article>`).join('')}function filter(kind){let r=[...data];if(kind==='offers')r=r.filter(x=>x.promotional_price);if(kind==='available')r=r.filter(x=>x.in_stock);if(kind==='low')r=r.filter(x=>Number(x.promotional_price||x.price)<=50);if(kind==='mid')r=r.filter(x=>{const n=Number(x.promotional_price||x.price);return n>50&&n<=200});if(kind==='high')r=r.filter(x=>Number(x.promotional_price||x.price)>200);render(r)}async function search(q){document.querySelector('#resultTitle').textContent=q?`Resultados para “${q}”`:'Explore o comércio de Arapongas';try{data=await window.ArapongasDigitalAPI.search(CITY,q);render(data)}catch(e){document.querySelector('#results').innerHTML='<div class="empty">Não foi possível consultar a base agora. Tente novamente.</div>'}}document.querySelector('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=document.querySelector('#query').value.trim();history.replaceState(null,'',q?`?q=${encodeURIComponent(q)}`:location.pathname);search(q)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>filter(b.dataset.filter));const q=new URLSearchParams(location.search).get('q')||'';document.querySelector('#query').value=q;if(q)search(q);</script></body></html>
