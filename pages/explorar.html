<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="description" content="Encontre produtos e empresas do comércio local de Arapongas."><title>Explorar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.explore{max-width:1120px;margin:auto;padding:24px 16px 100px}.head{background:linear-gradient(135deg,#061a44,#0a50b6);border-radius:25px;color:#fff;padding:28px}.head h1{font-size:38px;margin:6px 0}.filters{display:flex;gap:8px;overflow:auto;padding:15px 0}.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;color:#53657f;cursor:pointer}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.result .thumb{height:120px;background:#edf5ff;border-radius:14px;display:grid;place-items:center;font-size:45px;overflow:hidden}.result .thumb img{width:100%;height:100%;object-fit:cover}.result small{color:var(--muted);display:block}.result strong{display:block;font-size:20px;margin-top:8px}.result a{display:block;margin-top:12px;color:#0877ff;font-weight:850}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:20px;padding:35px;text-align:center;color:var(--muted)}.cartfloat{position:fixed;right:18px;bottom:18px;background:#061a44;color:#fff;border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:var(--shadow);z-index:10}@media(max-width:700px){.results{grid-template-columns:1fr 1fr}.head h1{font-size:30px}}@media(max-width:430px){.results{grid-template-columns:1fr}}</style></head><body><main class="explore"><a href="../index.html" style="color:#0877ff;font-weight:800">← Início</a><section class="head"><span class="eyebrow">BUSCA LOCAL</span><h1>Explore Arapongas</h1><p>Produtos cadastrados pelas empresas da cidade em um só lugar.</p><form class="search" id="searchForm"><span>⌕</span><input id="query" placeholder="Ex.: pizza, pneu, presente até R$ 200" maxlength="120" autocomplete="off"><button>Buscar</button></form></section><div class="filters"><button data-filter="all">Tudo</button><button data-filter="offers">Em oferta</button><button data-filter="available">Disponível</button><button data-filter="low">Até R$ 50</button><button data-filter="mid">R$ 50–200</button><button data-filter="high">Acima de R$ 200</button></div><div class="heading"><div><span class="kicker">RESULTADOS</span><h2 id="resultTitle">Explore o comércio de Arapongas</h2></div></div><section class="results" id="results"><div class="empty">Digite o que procura. Os resultados vêm dos cadastros reais da plataforma.</div></section></main><a class="cartfloat" href="carrinho.html">🛒 Pedido <span id="cartCount">0</span></a><script src="../js/api.js"></script><script src="../js/cart.js"></script><script>const CITY='249d9391-a604-4ade-8c0a-72ed98b6f261';let data=[];const $=id=>document.getElementById(id),results=$('results'),resultTitle=$('resultTitle'),query=$('query'),searchForm=$('searchForm'),cartCount=$('cartCount');const money=n=>{if(n==null||n==='')return'Consulte';const v=Number(n);return Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v):'Consulte'};const safeImage=value=>{try{const u=new URL(String(value||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};function empty(message){const d=document.createElement('div');d.className='empty';d.textContent=message;results.replaceChildren(d)}function count(){cartCount.textContent=ArapongasDigitalCart.read().reduce((s,x)=>s+(Number(x.qty)||0),0)}function render(items){if(!items.length){empty('Nenhum resultado cadastrado para esta busca ainda.');return}const frag=document.createDocumentFragment();items.forEach(p=>{const article=document.createElement('article');article.className='result';const thumb=document.createElement('div');thumb.className='thumb';const image=safeImage(p.image_url);if(image){const img=document.createElement('img');img.src=image;img.alt='';img.loading='lazy';img.decoding='async';thumb.append(img)}else thumb.textContent='📦';const availability=document.createElement('small');availability.textContent=`${p.category_name||'COMÉRCIO LOCAL'} · ${p.in_stock?'Disponível':'Consulte disponibilidade'}`;const name=document.createElement('h3');name.textContent=p.name||'Produto';const business=document.createElement('small');business.textContent=p.business_name||'Empresa local';const price=document.createElement('strong');price.textContent=money(p.promotional_price??p.price);article.append(thumb,availability,name,business,price);if(p.id){const a=document.createElement('a');a.href=`produto.html?id=${encodeURIComponent(p.id)}`;a.textContent='Ver detalhes →';article.append(a)}if(p.business_slug){const a=document.createElement('a');a.href=`empresa.html?slug=${encodeURIComponent(p.business_slug)}`;a.textContent='Ver empresa →';article.append(a)}frag.append(article)});results.replaceChildren(frag)}function filter(kind){let r=[...data];const valid=x=>Number.isFinite(Number(x.promotional_price??x.price));if(kind==='offers')r=r.filter(x=>x.promotional_price!=null);if(kind==='available')r=r.filter(x=>x.in_stock);if(kind==='low')r=r.filter(valid).filter(x=>Number(x.promotional_price??x.price)<=50);if(kind==='mid')r=r.filter(valid).filter(x=>{const n=Number(x.promotional_price??x.price);return n>50&&n<=200});if(kind==='high')r=r.filter(valid).filter(x=>Number(x.promotional_price??x.price)>200);render(r)}async function search(q){resultTitle.textContent=q?`Resultados para “${q}”`:'Explore o comércio de Arapongas';try{data=await ArapongasDigitalAPI.search(CITY,q);render(Array.isArray(data)?data:[])}catch{data=[];empty('Não foi possível consultar a base agora. Tente novamente.')}}searchForm.addEventListener('submit',e=>{e.preventDefault();const q=query.value.trim().slice(0,120);history.replaceState(null,'',q?`?q=${encodeURIComponent(q)}`:location.pathname);search(q)});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>filter(b.dataset.filter)));const initial=(new URLSearchParams(location.search).get('q')||'').slice(0,120);query.value=initial;if(initial)search(initial);count();window.addEventListener('ad:cart',count);</script></body></html>
