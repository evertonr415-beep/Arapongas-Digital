<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><meta name="theme-color" content="#061a44"><title>Promoções • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:1050px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:25px;padding:25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{background:#fff;color:#0877ff;padding:12px 14px;border-radius:12px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;margin-top:14px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{border:0;border-radius:999px;padding:9px 13px;font-weight:850;cursor:pointer}.tabs .on{background:#0877ff;color:#fff}.empty{text-align:center;padding:35px;color:var(--muted)}.items{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;gap:12px}.item h3{margin:0;color:#061a44}.meta{font-size:13px;color:var(--muted);margin-top:5px}.manage{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.manage button,.manage a{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.edit{background:#061a44;color:#fff}.toggle{background:#eef5ff;color:#075fc7}.delete{background:#fff0f0;color:#9a2525}@media(max-width:650px){.hero,.item{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="hero"><div><span class="eyebrow">CAMPANHAS COMERCIAIS</span><h1>Promoções e cupons</h1><p id="subtitle">Carregando campanhas…</p></div><div class="actions"><a href="oferta-nova.html">＋ Oferta</a><a href="cupom-novo.html">＋ Cupom</a></div></section><section class="card"><div class="tabs" role="tablist" aria-label="Tipo de campanha"><button id="tabOffers" type="button" class="on" role="tab" aria-selected="true">Ofertas</button><button id="tabCoupons" type="button" role="tab" aria-selected="false">Cupons</button></div><div class="empty" id="state" role="status" aria-live="polite">Carregando…</div></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let mode='offers',busy=false;const finite=v=>{const n=Number(v);return v!==null&&v!==undefined&&v!==''&&Number.isFinite(n)&&n>=0?n:null},fmt=d=>{if(!d)return'sem prazo';const x=new Date(d);return Number.isNaN(x.getTime())?'data indisponível':x.toLocaleString('pt-BR')},money=v=>{const n=finite(v);return n===null?'valor indisponível':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};function setMode(m){if(!['offers','coupons'].includes(m)||busy)return;mode=m;$('tabOffers').className=m==='offers'?'on':'';$('tabCoupons').className=m==='coupons'?'on':'';$('tabOffers').setAttribute('aria-selected',String(m==='offers'));$('tabCoupons').setAttribute('aria-selected',String(m==='coupons'));load()}function render(rows){rows=Array.isArray(rows)?rows.slice(0,500):[];const state=$('state');state.replaceChildren();state.className=rows.length?'items':'empty';if(!rows.length){state.textContent=mode==='offers'?'Nenhuma oferta cadastrada.':'Nenhum cupom cadastrado.';return}for(const r of rows){const item=document.createElement('article');item.className='item';const info=document.createElement('div'),h=document.createElement('h3'),meta=document.createElement('div');const title=String(mode==='offers'?(r.title||'Oferta'):(r.code||'Cupom')).slice(0,180);h.textContent=title;meta.className='meta';if(mode==='offers')meta.textContent=`${r.active?'Ativa':'Inativa'} • ${fmt(r.starts_at)} → ${fmt(r.ends_at)}`;else{const value=finite(r.discount_value),discount=r.discount_type==='percent'?(value===null?'desconto indisponível':`${value.toLocaleString('pt-BR')}%`):money(value),uses=Math.max(0,Number.isInteger(Number(r.uses_count))?Number(r.uses_count):0),max=Number.isInteger(Number(r.max_uses))&&Number(r.max_uses)>0?`/${Number(r.max_uses)}`:'';meta.textContent=`${discount} • ${r.active?'Ativo':'Inativo'} • usos ${uses}${max}`}info.append(h,meta);const manage=document.createElement('div');manage.className='manage';const edit=document.createElement('a');edit.className='edit';edit.href=mode==='offers'?`oferta-nova.html?id=${encodeURIComponent(String(r.id||''))}`:`cupom-novo.html?id=${encodeURIComponent(String(r.id||''))}`;edit.textContent='Editar';const t=document.createElement('button');t.type='button';t.className='toggle';t.textContent=r.active?'Desativar':'Ativar';t.addEventListener('click',async()=>{if(busy)return;busy=true;t.disabled=true;try{if(mode==='offers')await ArapongasDigitalAuth.setOfferActive(r.id,!r.active);else await ArapongasDigitalAuth.setCouponActive(r.id,!r.active);await load()}catch{alert('Não foi possível atualizar a campanha agora.')}finally{busy=false;t.disabled=false}});const d=document.createElement('button');d.type='button';d.className='delete';d.textContent='Excluir';d.addEventListener('click',async()=>{if(busy||!confirm(`Excluir ${mode==='offers'?'a oferta':'o cupom'} “${title}”?`))return;busy=true;d.disabled=true;try{if(mode==='offers')await ArapongasDigitalAuth.deleteOffer(r.id);else await ArapongasDigitalAuth.deleteCoupon(r.id);await load()}catch{alert('Não foi possível excluir a campanha agora.')}finally{busy=false;d.disabled=false}});manage.append(edit,t,d);item.append(info,manage);state.append(item)}}async function load(){try{const rows=mode==='offers'?await ArapongasDigitalAuth.ownOffers():await ArapongasDigitalAuth.ownCoupons();render(rows)}catch{$('state').className='empty';$('state').textContent='Não foi possível carregar as campanhas desta empresa.'}}async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=promocoes.html');return}const p=await ArapongasDigitalAuth.ensureProfile(u);if(!p?.active)throw new Error('Perfil indisponível');const b=await ArapongasDigitalAuth.requireOwnBusiness();$('subtitle').textContent=`Campanhas de ${String(b.name||'sua empresa').slice(0,180)}`;$('tabOffers').addEventListener('click',()=>setMode('offers'));$('tabCoupons').addEventListener('click',()=>setMode('coupons'));await load()}catch{$('state').textContent='Não foi possível validar e carregar as campanhas desta empresa.'}}init()})();</script></body></html>
