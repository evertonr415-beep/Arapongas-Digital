<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova oferta • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:720px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}label{display:block;font-size:12px;font-weight:850;margin-top:13px}input,textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:100px}.save{margin-top:18px;background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="card"><span class="kicker hot">PROMOÇÕES</span><h1>Nova oferta</h1><form id="form"><label>Título<input required placeholder="Ex.: Semana do Cliente"></label><label>Descrição<textarea placeholder="Explique a condição da oferta"></textarea></label><label>Início<input type="datetime-local" required></label><label>Fim<input type="datetime-local"></label><button class="save">Criar oferta</button></form></section></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();alert('Fluxo preparado; publicação será liberada com autenticação segura.');}</script></body></html>
