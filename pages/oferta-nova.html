<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Nova oferta • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:760px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}label{display:block;font-size:12px;font-weight:850;margin-top:13px}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:100px}.save{margin-top:18px;background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="promocoes.html" style="color:#0877ff;font-weight:850">← Promoções</a><section class="card"><span class="kicker hot">PROMOÇÕES</span><h1>Nova oferta</h1><div class="status" id="status">Verificando sua conta...</div><form id="form"><label>Título<input required placeholder="Ex.: Semana do Cliente"></label><label>Descrição<textarea placeholder="Explique a condição da oferta"></textarea></label><label>Produto relacionado<select id="product"><option value="">Oferta geral da empresa</option></select></label><div class="row"><label>Início<input type="datetime-local" required></label><label>Fim<input type="datetime-local"></label></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0"> Destacar esta oferta</label><button class="save" disabled>Criar oferta</button></form></section></main><script src="../js/auth.js"></script><script>async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=oferta-nova.html');return}status.innerHTML='<b>Conta autenticada.</b> A publicação será habilitada apenas após a empresa vinculada ser confirmada.'}catch{status.textContent='Não foi possível validar a sessão.'}}form.onsubmit=e=>e.preventDefault();init()</script></body></html>
