<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#061a44"><title>Oferta • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:760px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}label{display:block;font-size:12px;font-weight:850;margin-top:13px}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:100px}.save{margin-top:18px;background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}.status.ok{background:#eaf8ef;color:#176c38}.status.err{background:#fff0f0;color:#9a2525}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="promocoes.html" style="color:#0877ff;font-weight:850">← Promoções</a><section class="card"><span class="kicker hot" id="kicker">PROMOÇÕES</span><h1 id="heading">Nova oferta</h1><div class="status" id="status">Verificando sua empresa...</div><form id="form"><label>Título<input id="title" required maxlength="180" placeholder="Ex.: Semana do Cliente"></label><label>Descrição<textarea id="description" maxlength="5000" placeholder="Explique a condição da oferta"></textarea></label><label>Produto relacionado<select id="product"><option value="">Oferta geral da empresa</option></select></label><div class="row"><label>Início<input id="starts" type="datetime-local" required></label><label>Fim<input id="ends" type="datetime-local"></label></div><label style="display:flex;gap:8px;align-items:center"><input id="featured" type="checkbox" style="width:auto;margin:0"> Destacar esta oferta</label><button class="save" id="save" disabled>Criar oferta</button></form></section></main><script src="../js/auth.js"></script><script>const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),editId=params.get('id');let business=null,current=null;const validId=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v||''),localDate=v=>{if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return'';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace(`login.html?next=${encodeURIComponent('oferta-nova.html'+location.search)}`);return}business=await ArapongasDigitalAuth.requireOwnBusiness();const products=await ArapongasDigitalAuth.ownProducts();$('product').replaceChildren(new Option('Oferta geral da empresa',''),...products.filter(p=>p.active).map(p=>new Option(p.name,p.id)));if(editId){if(!validId(editId))throw new Error('Identificador de oferta inválido.');current=(await ArapongasDigitalAuth.ownOffers()).find(o=>o.id===editId);if(!current)throw new Error('Oferta não encontrada nesta empresa.');if(current.product_id&&!Array.from($('product').options).some(o=>o.value===current.product_id)){const p=products.find(p=>p.id===current.product_id);if(p)$('product').append(new Option(`${p.name} (inativo)`,p.id))}$('kicker').textContent='EDITAR PROMOÇÃO';$('heading').textContent='Editar oferta';$('title').value=current.title||'';$('description').value=current.description||'';$('product').value=current.product_id||'';$('starts').value=localDate(current.starts_at);$('ends').value=localDate(current.ends_at);$('featured').checked=Boolean(current.featured);$('save').textContent='Salvar alterações';document.title='Editar oferta • Arapongas Digital'}else{$('starts').value=localDate(new Date())}$('status').className='status ok';$('status').textContent=`Empresa confirmada: ${business.name}. ${current?'Edição segura liberada.':''}`;$('save').disabled=false}catch(e){$('status').className='status err';$('status').textContent=e?.message||'Não foi possível validar a empresa.'}}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!business)return;$('save').disabled=true;$('status').className='status';$('status').textContent=current?'Salvando alterações…':'Publicando oferta…';const payload={title:$('title').value,description:$('description').value,product_id:$('product').value||null,starts_at:$('starts').value,ends_at:$('ends').value,featured:$('featured').checked,active:current?current.active:true};try{if(current)await ArapongasDigitalAuth.updateOffer(current.id,payload);else await ArapongasDigitalAuth.createOffer(payload);$('status').className='status ok';$('status').textContent=current?'Oferta atualizada com sucesso.':'Oferta criada com sucesso.';setTimeout(()=>location.replace('promocoes.html'),450)}catch(err){$('status').className='status err';$('status').textContent=err?.message||'Não foi possível salvar a oferta.';$('save').disabled=false}});init()</script></body></html>
