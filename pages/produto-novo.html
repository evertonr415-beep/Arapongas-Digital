<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo produto • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:800px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:850}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}textarea{min-height:110px}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.hint{color:var(--muted);font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="card"><span class="kicker">CATÁLOGO</span><h1>Novo produto</h1><p class="hint">O produto só poderá ser publicado pela empresa autenticada responsável pelo catálogo.</p><form class="grid" id="form"><label class="wide">Nome<input required placeholder="Ex.: Smartphone 256 GB"></label><label>Categoria<select><option>Selecione</option><option>Alimentação</option><option>Mercados</option><option>Moda</option><option>Tecnologia</option><option>Automotivo</option><option>Casa e Construção</option><option>Saúde e Bem-estar</option><option>Serviços</option><option>Pet</option><option>Beleza</option></select></label><label>SKU<input placeholder="Código interno"></label><label>Preço<input type="number" min="0" step="0.01" placeholder="0,00"></label><label>Preço promocional<input type="number" min="0" step="0.01" placeholder="Opcional"></label><label class="wide">Descrição<textarea placeholder="Características e informações do produto"></textarea></label><label><input type="checkbox" style="width:auto"> Disponível em estoque</label><label><input type="checkbox" style="width:auto"> Destacar na vitrine</label><div class="wide"><button class="save">Salvar produto</button></div></form></section></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();alert('Cadastro preparado. A escrita será ativada após autenticação e autorização por empresa.');}</script></body></html>
