<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow"><title id="pageTitle">Produto • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:820px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:850}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}textarea{min-height:110px}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.hint,.status{color:var(--muted);font-size:12px}.status{background:#eef5ff;border-radius:12px;padding:12px;margin:12px 0}.status.ok{background:#eaf8ef;color:#176c38}.status.err{background:#fff0f0;color:#9a2525}.checks{display:flex;gap:20px;flex-wrap:wrap}.checks label{display:flex;gap:7px;align-items:center}.checks input{width:auto;margin:0}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="catalogo.html" style="color:#0877ff;font-weight:850">← Catálogo</a><section class="card"><span class="kicker">CATÁLOGO</span><h1 id="heading">Novo produto</h1><div class="status" id="status">Verificando sua empresa...</div><form class="grid" id="form"><label class="wide">Nome<input id="name" required maxlength="180"></label><label>Categoria<select id="category"><option value="">Carregando...</option></select></label><label>SKU<input id="sku" maxlength="100"></label><label>Preço<input id="price" type="number" min="0" step="0.01"></label><label>Preço promocional<input id="promo" type="number" min="0" step="0.01"></label><label>Quantidade em estoque<input id="stock" type="number" min="0" step="1"><span class="hint">Ao informar uma quantidade, a disponibilidade é calculada automaticamente. Deixe em branco para controle manual.</span></label><label class="wide">Descrição<textarea id="description" maxlength="5000"></textarea></label><div class="wide checks"><label><input id="inStock" type="checkbox" checked> Disponível em estoque</label><label><input id="featured" type="checkbox"> Destacar na vitrine</label><label><input id="active" type="checkbox" checked> Produto ativo</label></div><div class="wide"><button class="save" id="save" disabled>Salvar produto</button></div></form><p class="hint">A edição só encontra produtos da empresa vinculada à sessão; o RLS mantém o isolamento entre comerciantes.</p></section></main><script src="../js/auth.js"></script><script src="../js/api.js"></script><script>const A=ArapongasDigitalAPI,$=id=>document.getElementById(id),params=new URLSearchParams(location.search),editId=params.get('id');let business=null,editing=null;const uuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v||'');function syncStock(){const raw=$('stock').value.trim(),tracked=raw!=='';if(tracked){const n=Number(raw);$('inStock').checked=Number.isFinite(n)&&n>0}$('inStock').disabled=tracked}function fill(p){$('name').value=p.name||'';$('category').value=p.category_id||'';$('sku').value=p.sku||'';$('price').value=p.price??'';$('promo').value=p.promotional_price??'';$('stock').value=p.stock_quantity??'';$('description').value=p.description||'';$('inStock').checked=!!p.in_stock;$('featured').checked=!!p.featured;$('active').checked=p.active!==false;syncStock()}async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next='+encodeURIComponent('produto-novo.html'+location.search));return}business=await ArapongasDigitalAuth.requireOwnBusiness();const cats=await A.categories();$('category').replaceChildren(new Option('Selecione',''),...cats.map(c=>new Option(c.name,c.id)));if(editId){if(!uuid(editId))throw new Error('Identificador de produto inválido.');editing=(await ArapongasDigitalAuth.ownProducts()).find(p=>p.id===editId);if(!editing)throw new Error('Produto não encontrado nesta empresa.');fill(editing);$('heading').textContent='Editar produto';$('pageTitle').textContent='Editar produto • Arapongas Digital';$('save').textContent='Salvar alterações';$('status').textContent=`Editando ${editing.name} em ${business.name}.`}else{$('status').textContent=`Empresa confirmada: ${business.name}. Cadastro liberado.`;syncStock()}$('status').className='status ok';$('save').disabled=false}catch(e){$('status').className='status err';$('status').textContent=e?.message||'Não foi possível validar sua empresa.'}}$('stock').addEventListener('input',syncStock);$('form').addEventListener('submit',async e=>{e.preventDefault();if(!business)return;$('save').disabled=true;$('status').className='status';$('status').textContent=editing?'Salvando alterações…':'Salvando produto…';try{const payload={name:$('name').value,category_id:$('category').value||null,sku:$('sku').value,price:$('price').value,promotional_price:$('promo').value,stock_quantity:$('stock').value,description:$('description').value,in_stock:$('inStock').checked,featured:$('featured').checked,active:$('active').checked};if(editing)await ArapongasDigitalAuth.updateProduct(editing.id,payload);else await ArapongasDigitalAuth.createProduct(payload);$('status').className='status ok';$('status').textContent=editing?'Produto atualizado com sucesso.':'Produto cadastrado com sucesso.';setTimeout(()=>location.replace('catalogo.html'),450)}catch(err){$('status').className='status err';$('status').textContent=err?.message||'Não foi possível salvar o produto.';$('save').disabled=false}});init()</script></body></html>
