<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Novo produto • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:820px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:850}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}textarea{min-height:110px}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.hint,.status{color:var(--muted);font-size:12px}.status{background:#eef5ff;border-radius:12px;padding:12px;margin:12px 0}.checks{display:flex;gap:20px;flex-wrap:wrap}.checks label{display:flex;gap:7px;align-items:center}.checks input{width:auto;margin:0}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="catalogo.html" style="color:#0877ff;font-weight:850">← Catálogo</a><section class="card"><span class="kicker">CATÁLOGO</span><h1>Novo produto</h1><div class="status" id="status">Verificando sua conta...</div><form class="grid" id="form"><label class="wide">Nome<input id="name" required placeholder="Ex.: Smartphone 256 GB"></label><label>Categoria<select id="category" required><option value="">Carregando...</option></select></label><label>SKU<input id="sku" placeholder="Código interno"></label><label>Preço<input id="price" type="number" min="0" step="0.01" placeholder="0,00"></label><label>Preço promocional<input id="promo" type="number" min="0" step="0.01" placeholder="Opcional"></label><label>Quantidade em estoque<input id="stock" type="number" min="0" step="1" placeholder="Opcional"></label><label class="wide">Descrição<textarea id="description" placeholder="Características e informações do produto"></textarea></label><div class="wide checks"><label><input id="inStock" type="checkbox" checked> Disponível em estoque</label><label><input id="featured" type="checkbox"> Destacar na vitrine</label></div><div class="wide"><button class="save" id="save" disabled>Salvar produto</button></div></form><p class="hint">A escrita permanece bloqueada até a empresa vinculada ser validada. Isso evita cadastro de produtos em nome de terceiros.</p></section></main><script src="../js/auth.js"></script><script src="../js/api.js"></script><script>const A=ArapongasDigitalAPI;async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=produto-novo.html');return}const cats=await A.categories();category.innerHTML='<option value="">Selecione</option>'+cats.map(c=>`<option value="${c.id}">${A.escape(c.name)}</option>`).join('');status.innerHTML='<b>Conta autenticada.</b> A publicação será habilitada quando a empresa vinculada for confirmada.'}catch(e){status.textContent='Não foi possível validar a sessão.'}}form.onsubmit=e=>e.preventDefault();init()</script></body></html>
