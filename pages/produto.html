<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Produto • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:1000px;margin:auto;padding:25px 16px 95px}.back{color:#0877ff;font-weight:800}.detail{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}.bigphoto{min-height:430px;background:linear-gradient(145deg,#e3f0ff,#bedcff);display:grid;place-items:center;font-size:110px;background-size:cover;background-position:center}.content{padding:34px}.content h1{font-size:34px;margin:8px 0}.content p{color:var(--muted);line-height:1.6}.price{display:block;font-size:34px;margin:18px 0;color:#061a44}.old{display:block;color:#8795a8}.wa,.storelink,.cart{display:block;text-align:center;padding:15px;border-radius:13px;font-weight:900;border:0;width:100%;font-size:14px}.wa{background:#0877ff;color:#fff}.cart{margin-top:8px;background:#061a44;color:#fff;cursor:pointer}.storelink{margin-top:8px;background:#eef5ff;color:#0877ff}.store{margin-top:16px;background:#f2f7ff;border-radius:15px;padding:15px}.status{font-weight:800;color:#0877ff}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:650px){.detail{grid-template-columns:1fr}.bigphoto{min-height:280px}.content{padding:22px}}</style></head><body><main class="wrap"><a class="back" href="explorar.html">← Voltar para explorar</a><div class="detail" id="detail"><div class="empty">Carregando produto...</div></div></main><script src="../js/api.js"></script><script src="../js/cart.js"></script><script>const A=window.ArapongasDigitalAPI,E=A.escape,money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n));async function init(){const id=new URLSearchParams(location.search).get('id'),box=document.querySelector('#detail');if(!id){box.innerHTML='<div class="empty">Produto não informado.</div>';return}try{const p=(await A.productById(id))[0];if(!p){box.innerHTML='<div class="empty">Produto não encontrado ou indisponível.</div>';return}document.title=`${p.name} • Arapongas Digital`;const price=p.promotional_price??p.price,priceHtml=price!=null?`<strong class="price">${money(price)}</strong>`:'<strong class="price">Consulte o preço</strong>',old=p.promotional_price!=null&&p.price!=null?`<del class="old">${money(p.price)}</del>`:'',img=p.image_url?`style="background-image:url('${E(p.image_url)}')"`:'';box.innerHTML=`<div class="bigphoto" ${img}>${p.image_url?'':'🛍️'}</div><div class="content"><span class="kicker">${E(p.category_name||'PRODUTO LOCAL')}</span><h1>${E(p.name)}</h1><p>${E(p.description||'O estabelecimento ainda não adicionou uma descrição para este produto.')}</p>${old}${priceHtml}<div class="status">${p.in_stock?'● Disponível':'○ Consulte disponibilidade'}</div><a class="wa" id="wa" href="#">Conversar com a loja no WhatsApp</a><button class="cart" id="addCart">＋ Adicionar ao pedido</button><a class="storelink" href="carrinho.html">🛒 Ver meu pedido</a><a class="storelink" href="empresa.html?slug=${encodeURIComponent(p.business_slug)}">Ver página da empresa</a><div class="store"><b>${E(p.business_name||'Empresa local')}</b><p>Arapongas • PR<br>Preço e disponibilidade informados pelo estabelecimento.</p></div></div>`;const b=(await A.businessBySlug(p.business_slug))[0],wa=document.querySelector('#wa'),phone=b?.whatsapp||'';if(phone){const n=phone.replace(/\D/g,''),msg=`Olá! Encontrei ${p.name} no Arapongas Digital e gostaria de saber mais.${price!=null?' Preço exibido: '+money(price)+'.':''}`;wa.href=`https://wa.me/${n}?text=${encodeURIComponent(msg)}`;wa.target='_blank';wa.rel='noopener'}else{wa.textContent='WhatsApp não informado';wa.removeAttribute('href')}addCart.onclick=()=>{const ok=ArapongasDigitalCart.add({id:p.id,name:p.name,price:price,businessId:p.business_id,businessName:p.business_name,businessSlug:p.business_slug,whatsapp:phone});if(ok){addCart.textContent='✓ Adicionado ao pedido';setTimeout(()=>addCart.textContent='＋ Adicionar ao pedido',1200)}}}catch(err){box.innerHTML='<div class="empty">Não foi possível carregar este produto. Tente novamente em instantes.</div>'}}init();</script></body></html>
