<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="description" content="Produto do comércio local no Arapongas Digital."><title>Produto • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:1000px;margin:auto;padding:25px 16px 95px}.back{color:#0877ff;font-weight:800}.detail{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow)}.bigphoto{min-height:430px;background:linear-gradient(145deg,#e3f0ff,#bedcff);display:grid;place-items:center;font-size:110px;background-size:cover;background-position:center}.content{padding:34px}.content h1{font-size:34px;margin:8px 0}.content p{color:var(--muted);line-height:1.6}.price{display:block;font-size:34px;margin:18px 0;color:#061a44}.old{display:block;color:#8795a8}.wa,.storelink,.cart{display:block;text-align:center;padding:15px;border-radius:13px;font-weight:900;border:0;width:100%;font-size:14px}.wa{background:#0877ff;color:#fff}.cart{margin-top:8px;background:#061a44;color:#fff;cursor:pointer}.storelink{margin-top:8px;background:#eef5ff;color:#0877ff}.store{margin-top:16px;background:#f2f7ff;border-radius:15px;padding:15px}.status{font-weight:800;color:#0877ff}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:650px){.detail{grid-template-columns:1fr}.bigphoto{min-height:280px}.content{padding:22px}}</style></head><body><main class="wrap"><a class="back" href="explorar.html">← Voltar para explorar</a><div class="detail" id="detail"><div class="empty">Carregando produto...</div></div></main><script src="../js/api.js"></script><script src="../js/cart.js"></script><script>const A=window.ArapongasDigitalAPI,money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n));function node(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}function safeImage(value){try{const u=new URL(value,location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}async function init(){const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('detail');if(!id){box.replaceChildren(node('div','Produto não informado.','empty'));return}try{const p=(await A.productById(id))[0];if(!p){box.replaceChildren(node('div','Produto não encontrado ou indisponível.','empty'));return}document.title=(p.name||'Produto')+' • Arapongas Digital';const price=p.promotional_price??p.price,photo=node('div',null,'bigphoto'),img=safeImage(p.image_url);if(img)photo.style.backgroundImage=`url("${img.replace(/["\\]/g,'')}")`;else photo.textContent='🛍️';const content=node('div',null,'content'),kicker=node('span',p.category_name||'PRODUTO LOCAL','kicker'),title=node('h1',p.name||'Produto'),desc=node('p',p.description||'O estabelecimento ainda não adicionou uma descrição para este produto.');content.append(kicker,title,desc);if(p.promotional_price!=null&&p.price!=null)content.append(node('del',money(p.price),'old'));content.append(node('strong',price!=null?money(price):'Consulte o preço','price'),node('div',p.in_stock?'● Disponível':'○ Consulte disponibilidade','status'));const wa=node('a','Conversar com a loja no WhatsApp','wa'),cart=node('button','＋ Adicionar ao pedido','cart'),order=node('a','🛒 Ver meu pedido','storelink'),storeLink=node('a','Ver página da empresa','storelink');order.href='carrinho.html';storeLink.href='empresa.html?slug='+encodeURIComponent(p.business_slug||'');content.append(wa,cart,order,storeLink);const store=node('div',null,'store');store.append(node('b',p.business_name||'Empresa local'),node('p','Arapongas • PR\nPreço e disponibilidade informados pelo estabelecimento.'));content.append(store);box.replaceChildren(photo,content);const b=p.business_slug?(await A.businessBySlug(p.business_slug))[0]:null,phone=b?.whatsapp||'';if(phone){const n=phone.replace(/\D/g,'');if(n){const msg=`Olá! Encontrei ${p.name||'este produto'} no Arapongas Digital e gostaria de saber mais.${price!=null?' Preço exibido: '+money(price)+'.':''}`;wa.href=`https://wa.me/${n}?text=${encodeURIComponent(msg)}`;wa.target='_blank';wa.rel='noopener noreferrer'}}if(!wa.href||wa.getAttribute('href')===null){wa.textContent='WhatsApp não informado';wa.removeAttribute('href')}cart.onclick=()=>{const ok=ArapongasDigitalCart.add({id:p.id,name:p.name,price,businessId:p.business_id,businessName:p.business_name,businessSlug:p.business_slug,whatsapp:phone});if(ok){cart.textContent='✓ Adicionado ao pedido';setTimeout(()=>cart.textContent='＋ Adicionar ao pedido',1200)}}}catch{box.replaceChildren(node('div','Não foi possível carregar este produto. Tente novamente em instantes.','empty'))}}init();</script></body></html>
