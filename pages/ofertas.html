<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Ofertas • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:1120px;margin:auto;padding:24px 16px 100px}.hero{padding:30px;border-radius:28px;color:#fff;background:radial-gradient(circle at 85% 15%,#20a4ff88,transparent 28%),linear-gradient(135deg,#061a44,#0a50b6)}.hero h1{font-size:38px;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{background:#fff;border:1px solid var(--line);border-radius:21px;overflow:hidden}.pic{height:160px;background:linear-gradient(135deg,#eaf4ff,#cfe5ff);background-size:cover;background-position:center;display:grid;place-items:center;font-size:55px}.body{padding:17px}.body small{color:var(--muted)}.body h3{margin:7px 0}.badge{display:inline-block;background:#e8f3ff;color:#0877ff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.body a{display:block;margin-top:12px;color:#0877ff;font-weight:900}.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:20px;padding:40px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:31px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:850">← Início</a><section class="hero"><span class="eyebrow">OPORTUNIDADES LOCAIS</span><h1>Ofertas em Arapongas</h1><p>Promoções publicadas diretamente pelas empresas participantes.</p></section><section class="grid" id="grid"><div class="empty">Carregando ofertas...</div></section></main><script src="../js/api.js"></script><script>const CITY='249d9391-a604-4ade-8c0a-72ed98b6f261',A=ArapongasDigitalAPI,E=A.escape;const date=v=>v?new Intl.DateTimeFormat('pt-BR').format(new Date(v)):'',now=Date.now();async function init(){try{const offers=await A.offers(CITY),active=offers.filter(o=>(!o.starts_at||new Date(o.starts_at).getTime()<=now)&&(!o.ends_at||new Date(o.ends_at).getTime()>=now));grid.innerHTML=active.length?active.map(o=>`<article class="card"><div class="pic" ${o.image_url?`style="background-image:url('${E(o.image_url)}')"`:''}>${o.image_url?'':'🔥'}</div><div class="body"><span class="badge">${o.featured?'DESTAQUE':'OFERTA'}</span><h3>${E(o.title)}</h3><small>${E(o.business_name||'Empresa local')}</small><p>${E(o.description||'Consulte as condições diretamente com a empresa.')}</p>${o.ends_at?`<small>Válida até ${date(o.ends_at)}</small>`:''}${o.product_id?`<a href="produto.html?id=${encodeURIComponent(o.product_id)}">Ver produto →</a>`:''}<a href="empresa.html?slug=${encodeURIComponent(o.business_slug)}">Ver empresa →</a></div></article>`).join(''):'<div class="empty">Ainda não há ofertas ativas publicadas. Assim que as empresas cadastrarem promoções, elas aparecerão aqui.</div>'}catch(e){grid.innerHTML='<div class="empty">Não foi possível carregar as ofertas agora.</div>'}}init()</script></body></html>
