<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><meta name="theme-color" content="#061a44"><title>Serviços • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:1050px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:25px;padding:25px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero a{background:#fff;color:#0877ff;padding:13px 16px;border-radius:12px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;margin-top:14px}.empty{text-align:center;padding:35px;color:var(--muted)}.items{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;gap:12px}.item h3{margin:0;color:#061a44}.meta{font-size:13px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button,.actions a{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.edit{background:#061a44;color:#fff}.toggle{background:#eef5ff;color:#075fc7}.delete{background:#fff0f0;color:#9a2525}@media(max-width:600px){.hero{flex-direction:column;align-items:flex-start}.item{flex-direction:column}.actions{align-items:flex-start}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="hero"><div><span class="eyebrow">SERVIÇOS</span><h1>Meus serviços</h1><p id="subtitle">Carregando sua empresa…</p></div><a href="servico-novo.html">＋ Novo serviço</a></section><section class="card"><div class="empty" id="state" role="status" aria-live="polite"><b>Carregando serviços protegidos…</b></div></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let busy=false;const finite=v=>{const n=Number(v);return v!==null&&v!==undefined&&v!==''&&Number.isFinite(n)&&n>=0?n:null},money=v=>{const n=finite(v);return n===null?'Preço sob consulta':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})},duration=v=>{const n=Number(v);return Number.isInteger(n)&&n>0&&n<=1440?n:null};async function load(){const out=await ArapongasDigitalAuth.ownServices(),rows=Array.isArray(out)?out.slice(0,500):[],state=$('state');state.replaceChildren();state.className=rows.length?'items':'empty';if(!rows.length){state.textContent='Nenhum serviço cadastrado ainda.';return}for(const s of rows){const name=String(s?.name||'Serviço').slice(0,180),item=document.createElement('article');item.className='item';const info=document.createElement('div'),h=document.createElement('h3'),m=document.createElement('div');h.textContent=name;m.className='meta';const dur=duration(s?.duration_minutes);m.textContent=`${money(s?.price_from)}${dur?` • ${dur} min`:''}${s?.appointment_enabled?' • Agendamento indicado':''} • ${s?.active?'Ativo':'Inativo'}`;info.append(h,m);const a=document.createElement('div');a.className='actions';const edit=document.createElement('a');edit.className='edit';edit.href=`servico-novo.html?id=${encodeURIComponent(String(s?.id||''))}`;edit.textContent='Editar';const t=document.createElement('button');t.type='button';t.className='toggle';t.textContent=s?.active?'Desativar':'Ativar';t.addEventListener('click',async()=>{if(busy)return;busy=true;t.disabled=true;try{await ArapongasDigitalAuth.setServiceActive(s.id,!s.active);await load()}catch{alert('Não foi possível atualizar o serviço agora.')}finally{busy=false;t.disabled=false}});const d=document.createElement('button');d.type='button';d.className='delete';d.textContent='Excluir';d.addEventListener('click',async()=>{if(busy||!confirm(`Excluir o serviço “${name}”?`))return;busy=true;d.disabled=true;try{await ArapongasDigitalAuth.deleteService(s.id);await load()}catch{alert('Não foi possível excluir o serviço agora.')}finally{busy=false;d.disabled=false}});a.append(edit,t,d);item.append(info,a);state.append(item)}}async function init(){try{const ss=await ArapongasDigitalAuth.session(),u=ss?.user||ss?.data?.user;if(!u){location.replace('login.html?next=servicos.html');return}const p=await ArapongasDigitalAuth.ensureProfile(u);if(!p?.active)throw new Error('Perfil indisponível');const b=await ArapongasDigitalAuth.requireOwnBusiness();if(b?.owner_profile_id!==p.id)throw new Error('Vínculo inválido');$('subtitle').textContent=`Serviços de ${String(b.name||'sua empresa').slice(0,180)}`;await load()}catch{$('state').className='empty';$('state').textContent='Não foi possível validar e carregar os serviços desta empresa.'}}init()})();</script></body></html>
