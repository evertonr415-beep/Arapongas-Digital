<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#061a44"><title>Serviços • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:1050px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:25px;padding:25px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero a{background:#fff;color:#0877ff;padding:13px 16px;border-radius:12px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:20px;margin-top:14px}.empty{text-align:center;padding:35px;color:var(--muted)}.items{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;justify-content:space-between;gap:12px}.item h3{margin:0;color:#061a44}.meta{font-size:13px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button,.actions a{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.edit{background:#061a44;color:#fff}.toggle{background:#eef5ff;color:#075fc7}.delete{background:#fff0f0;color:#9a2525}@media(max-width:600px){.hero{flex-direction:column;align-items:flex-start}.item{flex-direction:column}.actions{align-items:flex-start}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="hero"><div><span class="eyebrow">SERVIÇOS E AGENDAMENTOS</span><h1>Meus serviços</h1><p id="subtitle">Carregando sua empresa…</p></div><a href="servico-novo.html">＋ Novo serviço</a></section><section class="card"><div class="empty" id="state"><b>Carregando serviços protegidos…</b></div></section></main><script src="../js/auth.js"></script><script>const $=id=>document.getElementById(id),money=v=>v==null?'Preço sob consulta':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function load(){const rows=await ArapongasDigitalAuth.ownServices(),state=$('state');state.replaceChildren();state.className=rows.length?'items':'empty';if(!rows.length){state.textContent='Nenhum serviço cadastrado ainda.';return}for(const s of rows){const item=document.createElement('article');item.className='item';const info=document.createElement('div'),h=document.createElement('h3'),m=document.createElement('div');h.textContent=s.name;m.className='meta';m.textContent=`${money(s.price_from)}${s.duration_minutes?` • ${s.duration_minutes} min`:''}${s.appointment_enabled?' • Agendamento habilitado':''} • ${s.active?'Ativo':'Inativo'}`;info.append(h,m);const a=document.createElement('div');a.className='actions';const edit=document.createElement('a');edit.className='edit';edit.href=`servico-novo.html?id=${encodeURIComponent(s.id)}`;edit.textContent='Editar';const t=document.createElement('button');t.className='toggle';t.textContent=s.active?'Desativar':'Ativar';t.onclick=async()=>{t.disabled=true;try{await ArapongasDigitalAuth.setServiceActive(s.id,!s.active);await load()}catch(e){alert(e.message);t.disabled=false}};const d=document.createElement('button');d.className='delete';d.textContent='Excluir';d.onclick=async()=>{if(!confirm(`Excluir o serviço “${s.name}”?`))return;d.disabled=true;try{await ArapongasDigitalAuth.deleteService(s.id);await load()}catch(e){alert(e.message);d.disabled=false}};a.append(edit,t,d);item.append(info,a);state.append(item)}}async function init(){try{const ss=await ArapongasDigitalAuth.session(),u=ss?.user||ss?.data?.user;if(!u){location.replace('login.html?next=servicos.html');return}const b=await ArapongasDigitalAuth.requireOwnBusiness();$('subtitle').textContent=`Serviços de ${b.name}`;await load()}catch(e){$('state').textContent=e?.message||'Não foi possível carregar os serviços.'}}init()</script></body></html>
