<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Empresas • Master Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:1100px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:24px;padding:24px}.guard,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:13px}.guard.ok{background:#eaf8ef;border-color:#bce5ca;color:#176c38}.guard.err{background:#fff0f0;border-color:#ffcaca;color:#9a2525}.tools{display:flex;gap:10px}.tools input,.tools select{padding:12px;border:1px solid var(--line);border-radius:12px}.tools input{flex:1}.empty{text-align:center;color:var(--muted);padding:38px}.requests{display:grid;gap:12px;margin-top:16px}.request{border:1px solid var(--line);border-radius:16px;padding:16px}.request h3{margin:0 0 8px;color:#061a44}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}.badge{background:#eef5ff;color:#075fc7;padding:5px 9px;border-radius:999px;font-weight:800}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:0;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.approve{background:#0877ff;color:#fff}.reject{background:#eef1f5;color:#334}.actions button:disabled{opacity:.5;cursor:not-allowed}.result{margin-top:10px;font-size:13px;font-weight:750}.result.ok{color:#176c38}.result.err{color:#9a2525}@media(max-width:600px){.tools{flex-direction:column}.actions{flex-direction:column}}</style></head><body><main class="wrap"><a href="admin.html" style="color:#0877ff;font-weight:850">← Master Admin</a><section class="hero"><span class="eyebrow">GESTÃO CENTRAL</span><h1>Empresas da plataforma</h1><p>Validação, ativação e acompanhamento das solicitações comerciais.</p></section><div class="guard" id="guard" role="status" aria-live="polite"><b>Área restrita.</b> Validando autorização administrativa…</div><section class="card"><div class="tools"><input id="search" maxlength="120" autocomplete="off" aria-label="Buscar solicitação" placeholder="Buscar empresa, CNPJ/CPF ou WhatsApp" disabled><select id="status" aria-label="Filtrar por status" disabled><option value="pending">Pendentes</option><option value="approved">Aprovadas</option><option value="rejected">Rejeitadas</option><option value="cancelled">Canceladas</option></select></div><div id="list" class="empty" role="status" aria-live="polite"><b>Carregando…</b></div></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const guard=document.getElementById('guard'),list=document.getElementById('list'),search=document.getElementById('search'),statusEl=document.getElementById('status');let rows=[],loading=false;const text=(v,max=180)=>String(v??'').slice(0,max),date=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'Data indisponível':d.toLocaleString('pt-BR')};function render(){const q=search.value.trim().toLocaleLowerCase('pt-BR').slice(0,120),filtered=rows.filter(r=>[r.business_name,r.document,r.whatsapp].some(v=>text(v).toLocaleLowerCase('pt-BR').includes(q)));list.className=filtered.length?'requests':'empty';list.replaceChildren();if(!filtered.length){const b=document.createElement('b');b.textContent='Nenhuma solicitação encontrada.';list.append(b);return}for(const r of filtered){const name=text(r.business_name)||'Empresa';const box=document.createElement('article');box.className='request';const h=document.createElement('h3');h.textContent=name;const meta=document.createElement('div');meta.className='meta';for(const value of [`Status: ${text(r.status,40)}`,r.document?`Documento: ${text(r.document,30)}`:'Documento não informado',r.whatsapp?`WhatsApp: ${text(r.whatsapp,30)}`:'WhatsApp não informado',`Solicitado: ${date(r.created_at)}`]){const s=document.createElement('span');s.className='badge';s.textContent=value;meta.append(s)}box.append(h,meta);if(r.status==='pending'){const actions=document.createElement('div');actions.className='actions';const approve=document.createElement('button');approve.type='button';approve.className='approve';approve.textContent='Aprovar empresa';const reject=document.createElement('button');reject.type='button';reject.className='reject';reject.textContent='Rejeitar';const result=document.createElement('div');result.className='result';result.setAttribute('role','status');result.setAttribute('aria-live','polite');const busy=on=>{approve.disabled=on;reject.disabled=on};approve.addEventListener('click',async()=>{if(!confirm(`Aprovar a empresa “${name}”?`))return;busy(true);result.className='result';result.textContent='Aprovando e vinculando empresa…';try{await ArapongasDigitalAuth.approveMerchantRequest(r.id,name);result.className='result ok';result.textContent='Empresa aprovada e vinculada com segurança.';await load()}catch{busy(false);result.className='result err';result.textContent='Não foi possível aprovar a empresa agora.'}});reject.addEventListener('click',async()=>{const notes=prompt(`Motivo da rejeição de “${name}” (opcional):`,'');if(notes===null)return;const safeNotes=String(notes).trim().slice(0,1000);if(!confirm(`Confirmar rejeição de “${name}”?`))return;busy(true);result.className='result';result.textContent='Registrando rejeição…';try{await ArapongasDigitalAuth.rejectMerchantRequest(r.id,safeNotes);result.className='result ok';result.textContent='Solicitação rejeitada e registrada.';await load()}catch{busy(false);result.className='result err';result.textContent='Não foi possível rejeitar a solicitação agora.'}});actions.append(approve,reject);box.append(actions,result)}list.append(box)}}async function load(){if(loading)return;loading=true;search.disabled=true;statusEl.disabled=true;try{const out=await ArapongasDigitalAuth.adminMerchantRequests(statusEl.value);rows=Array.isArray(out)?out.slice(0,500):[];render()}finally{loading=false;search.disabled=false;statusEl.disabled=false}}function showError(){guard.className='guard err';guard.textContent='Acesso administrativo não autorizado ou temporariamente indisponível.';list.className='empty';list.textContent='Dados administrativos não foram liberados.';search.disabled=true;statusEl.disabled=true}async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=admin-empresas.html');return}const p=await ArapongasDigitalAuth.requireAdmin();if(!p?.active||!['admin','superadmin'].includes(p.role))throw new Error('Acesso negado');guard.className='guard ok';guard.textContent=`Acesso administrativo confirmado • ${p.role}`;search.addEventListener('input',render);statusEl.addEventListener('change',()=>load().catch(showError));await load()}catch{showError()}}init()})();</script></body></html>
