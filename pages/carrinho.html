<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Meu pedido • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:760px;margin:auto;padding:25px 16px 100px}.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.qty{display:flex;gap:7px;align-items:center}.qty button{border:0;border-radius:9px;padding:7px 10px;font-weight:900}.total{font-size:24px;font-weight:900;text-align:right}.wa{display:block;background:#0877ff;color:#fff;text-align:center;padding:15px;border-radius:13px;font-weight:900;margin-top:14px}.muted{color:var(--muted)}.clear{border:0;background:transparent;color:#d33;font-weight:800}</style></head><body><main class="wrap"><a href="explorar.html" style="color:#0877ff;font-weight:850">← Continuar explorando</a><span class="kicker" style="display:block;margin-top:25px">PEDIDO LOCAL</span><h1>Seu carrinho</h1><p class="muted">O Arapongas Digital organiza os itens. O pagamento e a confirmação continuam diretamente com a empresa.</p><section class="box"><div id="items"></div><div class="total" id="total"></div><a class="wa" id="send" href="#">Enviar pedido pelo WhatsApp</a><button class="clear" id="clear">Limpar carrinho</button></section></main><script src="../js/api.js"></script><script src="../js/cart.js"></script><script>const C=ArapongasDigitalCart,E=ArapongasDigitalAPI.escape,$=id=>document.getElementById(id),items=$('items'),total=$('total'),send=$('send'),clear=$('clear');const validPrice=v=>v!==null&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0,money=n=>validPrice(n)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)):'Preço a consultar';async function render(){const a=C.read();send.textContent='Enviar pedido pelo WhatsApp';send.removeAttribute('href');send.removeAttribute('target');if(!a.length){items.innerHTML='<p class="muted">Seu carrinho está vazio.</p>';total.textContent='';send.hidden=true;clear.hidden=true;return}send.hidden=false;clear.hidden=false;items.innerHTML=a.map(x=>`<div class="item"><div><b>${E(x.name)}</b><div class="muted">${E(x.businessName||'Empresa local')} · ${money(x.price)}</div></div><div class="qty"><button type="button" onclick="change('${E(x.id)}',${x.qty-1})" aria-label="Diminuir quantidade">−</button><b>${x.qty}</b><button type="button" onclick="change('${E(x.id)}',${x.qty+1})" aria-label="Aumentar quantidade">+</button></div></div>`).join('');const known=a.every(x=>validPrice(x.price));total.textContent=known?'Total: '+money(C.total()):'Total final: confirmar com a empresa';let wa=a[0].whatsapp;if(!wa&&a[0].businessSlug){try{const b=(await ArapongasDigitalAPI.businessBySlug(a[0].businessSlug))[0];wa=b?.whatsapp}catch{}}const num=String(wa||'').replace(/\D/g,'');if(num.length>=10&&num.length<=15){send.href=`https://wa.me/${num}?text=${encodeURIComponent(C.message())}`;send.target='_blank';send.rel='noopener noreferrer'}else{send.textContent='WhatsApp não informado'}}function change(id,q){C.setQty(id,q);render()}clear.onclick=()=>{C.clear();render()};render()</script></body></html>
