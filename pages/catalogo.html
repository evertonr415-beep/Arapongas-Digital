<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Catálogo • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:1080px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:25px;padding:25px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero a{background:#fff;color:#0877ff;padding:13px 16px;border-radius:12px;font-weight:900}.bar,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:13px}.bar{display:flex;gap:9px}.bar input{flex:1}.bar input,.bar select{border:1px solid var(--line);border-radius:12px;padding:12px}.empty{text-align:center;padding:42px;color:var(--muted)}.items{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px;border:1px solid var(--line);border-radius:15px}.item h3{margin:0;color:#061a44}.meta{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button,.actions a{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer;font-size:13px}.edit{background:#061a44;color:#fff}.toggle{background:#eef5ff;color:#075fc7}.delete{background:#fff0f0;color:#9a2525}.badge{font-size:11px;font-weight:850;padding:4px 7px;border-radius:999px;background:#eaf8ef;color:#176c38}.badge.off{background:#eef1f5;color:#667}@media(max-width:600px){.hero{align-items:flex-start;flex-direction:column}.bar{flex-direction:column}.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="hero"><div><span class="eyebrow">GESTÃO DE CATÁLOGO</span><h1>Meus produtos</h1><p id="subtitle">Carregando sua vitrine…</p></div><a href="produto-novo.html">＋ Novo produto</a></section><div class="bar"><input id="search" maxlength="120" autocomplete="off" placeholder="Buscar no meu catálogo" disabled aria-label="Buscar no meu catálogo"><select id="filter" disabled aria-label="Filtrar produtos"><option value="all">Todos os produtos</option><option value="active">Ativos</option><option value="out">Sem estoque</option><option value="promo">Em promoção agora</option></select></div><section class="card"><div class="empty" id="state" role="status" aria-live="polite"><b>Carregando catálogo protegido…</b></div></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let products=[],busy=false;const finite=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)&&n>=0?n:null},money=v=>{const n=finite(v);return n===null?'Preço sob consulta':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})},activePromo=p=>{if(finite(p.promotional_price)===null)return false;const now=Date.now(),start=p.promo_starts_at?new Date(p.promo_starts_at).getTime():null,end=p.promo_ends_at?new Date(p.promo_ends_at).getTime():null;return(start===null||Number.isFinite(start)&&start<=now)&&(end===null||Number.isFinite(end)&&end>now)};function filtered(){const q=$('search').value.trim().toLocaleLowerCase('pt-BR').slice(0,120),f=$('filter').value;return products.filter(p=>(!q||[p.name,p.sku,p.description].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(q)))&&(f==='all'||f==='active'&&p.active||f==='out'&&!p.in_stock||f==='promo'&&activePromo(p)))}function render(){const rows=filtered(),state=$('state');state.replaceChildren();state.className=rows.length?'items':'empty';if(!rows.length){const b=document.createElement('b');b.textContent=products.length?'Nenhum produto corresponde ao filtro.':'Seu catálogo ainda está vazio.';state.append(b);return}for(const p of rows){const item=document.createElement('article');item.className='item';const info=document.createElement('div'),h=document.createElement('h3'),meta=document.createElement('div'),badge=document.createElement('span');h.textContent=String(p.name||'Produto').slice(0,180);const promo=activePromo(p)?finite(p.promotional_price):null,price=finite(p.price);meta.className='meta';meta.textContent=`${p.sku?`SKU ${String(p.sku).slice(0,100)} • `:''}${promo!==null?`${money(promo)}${price!==null?` (de ${money(price)})`:''}`:money(price)}${Number.isInteger(Number(p.stock_quantity))&&Number(p.stock_quantity)>=0?` • Estoque: ${Number(p.stock_quantity)}`:''}`;badge.className=`badge${p.active?'':' off'}`;badge.textContent=p.active?'Ativo':'Inativo';info.append(h,meta,badge);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('a');edit.className='edit';edit.href=`produto-novo.html?id=${encodeURIComponent(String(p.id||''))}`;edit.textContent='Editar';const toggle=document.createElement('button');toggle.type='button';toggle.className='toggle';toggle.textContent=p.active?'Desativar':'Ativar';toggle.addEventListener('click',async()=>{if(busy)return;busy=true;toggle.disabled=true;try{await ArapongasDigitalAuth.setProductActive(p.id,!p.active);await load()}catch{alert('Não foi possível atualizar o produto agora.')}finally{busy=false;toggle.disabled=false}});const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='Excluir';del.addEventListener('click',async()=>{if(busy||!confirm(`Excluir “${String(p.name||'Produto').slice(0,180)}”? Esta ação remove o produto do catálogo.`))return;busy=true;del.disabled=true;try{await ArapongasDigitalAuth.deleteProduct(p.id);await load()}catch{alert('Não foi possível excluir o produto agora.')}finally{busy=false;del.disabled=false}});actions.append(edit,toggle,del);item.append(info,actions);state.append(item)}}async function load(){const r=await ArapongasDigitalAuth.ownProducts();products=Array.isArray(r)?r.slice(0,1000):[];render()}async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=catalogo.html');return}const p=await ArapongasDigitalAuth.ensureProfile(u);if(!p?.active)throw new Error('Perfil comercial indisponível.');const b=await ArapongasDigitalAuth.requireOwnBusiness();$('subtitle').textContent=`Catálogo de ${String(b.name||'sua empresa').slice(0,180)}`;$('search').disabled=false;$('filter').disabled=false;$('search').addEventListener('input',render);$('filter').addEventListener('change',render);await load()}catch{$('state').className='empty';$('state').textContent='Não foi possível validar e carregar o catálogo desta empresa.'}}init()})();</script></body></html>
