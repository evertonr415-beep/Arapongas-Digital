<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow"><title>Catálogo • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:1080px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:25px;padding:25px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero a{background:#fff;color:#0877ff;padding:13px 16px;border-radius:12px;font-weight:900}.bar,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:13px}.bar{display:flex;gap:9px}.bar input{flex:1}.bar input,.bar select{border:1px solid var(--line);border-radius:12px;padding:12px}.empty{text-align:center;padding:42px;color:var(--muted)}.items{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px;border:1px solid var(--line);border-radius:15px}.item h3{margin:0;color:#061a44}.meta{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button,.actions a{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer;font-size:13px}.edit{background:#061a44;color:#fff}.toggle{background:#eef5ff;color:#075fc7}.delete{background:#fff0f0;color:#9a2525}.badge{font-size:11px;font-weight:850;padding:4px 7px;border-radius:999px;background:#eaf8ef;color:#176c38}.badge.off{background:#eef1f5;color:#667}@media(max-width:600px){.hero{align-items:flex-start;flex-direction:column}.bar{flex-direction:column}.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="hero"><div><span class="eyebrow">GESTÃO DE CATÁLOGO</span><h1>Meus produtos</h1><p id="subtitle">Carregando sua vitrine…</p></div><a href="produto-novo.html">＋ Novo produto</a></section><div class="bar"><input id="search" placeholder="Buscar no meu catálogo" disabled><select id="filter" disabled><option value="all">Todos os produtos</option><option value="active">Ativos</option><option value="out">Sem estoque</option><option value="promo">Em promoção</option></select></div><section class="card"><div class="empty" id="state"><b>Carregando catálogo protegido…</b></div></section></main><script src="../js/auth.js"></script><script>const $=id=>document.getElementById(id);let products=[];const money=v=>v==null?'Preço sob consulta':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function filtered(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;return products.filter(p=>(!q||[p.name,p.sku,p.description].some(v=>String(v||'').toLowerCase().includes(q)))&&(f==='all'||f==='active'&&p.active||f==='out'&&!p.in_stock||f==='promo'&&p.promotional_price!=null))}function render(){const rows=filtered(),state=$('state');state.replaceChildren();state.className=rows.length?'items':'empty';if(!rows.length){const b=document.createElement('b');b.textContent=products.length?'Nenhum produto corresponde ao filtro.':'Seu catálogo ainda está vazio.';state.append(b);return}for(const p of rows){const item=document.createElement('article');item.className='item';const info=document.createElement('div'),h=document.createElement('h3'),meta=document.createElement('div'),badge=document.createElement('span');h.textContent=p.name;meta.className='meta';meta.textContent=`${p.sku?`SKU ${p.sku} • `:''}${p.promotional_price!=null?`${money(p.promotional_price)} (de ${money(p.price)})`:money(p.price)}${p.stock_quantity!=null?` • Estoque: ${p.stock_quantity}`:''}`;badge.className=`badge${p.active?'':' off'}`;badge.textContent=p.active?'Ativo':'Inativo';info.append(h,meta,badge);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('a');edit.className='edit';edit.href=`produto-novo.html?id=${encodeURIComponent(p.id)}`;edit.textContent='Editar';const toggle=document.createElement('button');toggle.className='toggle';toggle.textContent=p.active?'Desativar':'Ativar';toggle.onclick=async()=>{toggle.disabled=true;try{await ArapongasDigitalAuth.setProductActive(p.id,!p.active);await load()}catch(e){alert(e.message||'Falha ao atualizar produto.');toggle.disabled=false}};const del=document.createElement('button');del.className='delete';del.textContent='Excluir';del.onclick=async()=>{if(!confirm(`Excluir “${p.name}”? Esta ação remove o produto do catálogo.`))return;del.disabled=true;try{await ArapongasDigitalAuth.deleteProduct(p.id);await load()}catch(e){alert(e.message||'Falha ao excluir produto.');del.disabled=false}};actions.append(edit,toggle,del);item.append(info,actions);state.append(item)}}async function load(){products=await ArapongasDigitalAuth.ownProducts();render()}async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=catalogo.html');return}const b=await ArapongasDigitalAuth.requireOwnBusiness();$('subtitle').textContent=`Catálogo de ${b.name}`;$('search').disabled=false;$('filter').disabled=false;$('search').addEventListener('input',render);$('filter').addEventListener('change',render);await load()}catch(e){$('state').className='empty';$('state').textContent=e?.message||'Não foi possível carregar o catálogo.'}}init()</script></body></html>
