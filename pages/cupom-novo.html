<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Novo cupom • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:760px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:850}input,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}.preview{margin-top:18px;border:2px dashed #a9cfff;border-radius:18px;padding:18px;text-align:center;background:#f7fbff}.code{font-size:25px;font-weight:950;color:#0877ff;letter-spacing:2px}@media(max-width:550px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="promocoes.html" style="color:#0877ff;font-weight:850">← Promoções</a><section class="card"><span class="kicker">CUPONS</span><h1>Criar cupom</h1><div class="status" id="status">Verificando sua conta...</div><form class="grid" id="form"><label class="wide">Código<input id="code" required maxlength="40" placeholder="EX.: ARAPONGAS10"></label><label>Tipo<select id="type"><option value="percent">Percentual</option><option value="fixed">Valor fixo</option></select></label><label>Valor<input id="value" type="number" min="0" step="0.01" required></label><label>Início<input type="datetime-local"></label><label>Fim<input type="datetime-local"></label><label>Limite de usos<input type="number" min="1"></label><label>Pedido mínimo<input type="number" min="0" step="0.01"></label><label class="wide" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" checked> Cupom ativo</label><div class="wide"><button class="save" disabled>Criar cupom</button></div></form><div class="preview"><small>PRÉVIA DO CUPOM</small><div class="code" id="previewCode">SEUCUPOM</div><div id="previewValue">Defina o benefício</div></div></section></main><script src="../js/auth.js"></script><script>function preview(){previewCode.textContent=(code.value||'SEUCUPOM').toUpperCase();previewValue.textContent=value.value?(type.value==='percent'?value.value+'% de desconto':'R$ '+Number(value.value).toFixed(2).replace('.',',')+' de desconto'):'Defina o benefício'}code.oninput=preview;value.oninput=preview;type.onchange=preview;async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=cupom-novo.html');return}status.innerHTML='<b>Conta autenticada.</b> O cupom será liberado somente após confirmar a empresa vinculada.'}catch{status.textContent='Não foi possível validar a sessão.'}}form.onsubmit=e=>e.preventDefault();init()</script></body></html>
