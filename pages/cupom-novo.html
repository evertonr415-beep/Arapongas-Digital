<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo cupom • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:720px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:850}input,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}@media(max-width:550px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><section class="card"><span class="kicker">CUPONS</span><h1>Criar cupom</h1><form class="grid" id="form"><label class="wide">Código<input required maxlength="40" placeholder="EX.: ARAPONGAS10"></label><label>Tipo<select><option value="percent">Percentual</option><option value="fixed">Valor fixo</option></select></label><label>Valor<input type="number" min="0" step="0.01" required></label><label>Início<input type="datetime-local"></label><label>Fim<input type="datetime-local"></label><label>Limite de usos<input type="number" min="1"></label><label>Pedido mínimo<input type="number" min="0" step="0.01"></label><div class="wide"><button class="save">Criar cupom</button></div></form></section></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();alert('Fluxo preparado; o cupom será gravado quando o comerciante estiver autenticado.');}</script></body></html>
