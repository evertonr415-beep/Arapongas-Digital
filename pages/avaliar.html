<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Avaliar empresa • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:700px;margin:auto;padding:24px 16px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.stars{display:flex;gap:8px;margin:18px 0}.stars button{font-size:32px;border:0;background:transparent;cursor:pointer;color:#aab7c7}.stars button.on{color:#ffb000}textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:13px;padding:12px}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0}.status.ok{background:#eaf8ef;color:#176c38}.save{margin-top:15px;background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.55;cursor:not-allowed}.note{font-size:12px;color:var(--muted);margin-top:9px}</style></head><body><main class="wrap"><a href="explorar.html" style="color:#0877ff;font-weight:850">← Explorar</a><section class="card"><span class="kicker">SUA EXPERIÊNCIA</span><h1>Avaliar empresa</h1><p>Compartilhe uma experiência útil para outros consumidores.</p><div class="status" id="status" role="status" aria-live="polite">Verificando sua conta...</div><div class="stars" id="stars" aria-label="Nota de 1 a 5"><button type="button" data-v="1" aria-label="1 estrela">★</button><button type="button" data-v="2" aria-label="2 estrelas">★</button><button type="button" data-v="3" aria-label="3 estrelas">★</button><button type="button" data-v="4" aria-label="4 estrelas">★</button><button type="button" data-v="5" aria-label="5 estrelas">★</button></div><textarea id="comment" maxlength="1000" placeholder="Conte como foi sua experiência. Evite dados pessoais ou conteúdo ofensivo."></textarea><button class="save" disabled id="save" type="button" aria-disabled="true">Avaliações em preparação</button><div class="note">A publicação será liberada somente quando o vínculo com a empresa e as regras de moderação estiverem ativos.</div></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const statusEl=document.getElementById('status'),starsEl=document.getElementById('stars'),commentEl=document.getElementById('comment'),saveEl=document.getElementById('save');let rating=0;const update=()=>{starsEl.querySelectorAll('button').forEach(x=>{const on=Number(x.dataset.v)<=rating;x.classList.toggle('on',on);x.setAttribute('aria-pressed',String(on))});saveEl.disabled=true;saveEl.setAttribute('aria-disabled','true')};starsEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{rating=Math.min(5,Math.max(1,Number(b.dataset.v)||0));update()}));commentEl.addEventListener('input',()=>{if(commentEl.value.length>1000)commentEl.value=commentEl.value.slice(0,1000)});async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){const next=location.pathname.split('/').pop()+location.search;location.replace('login.html?next='+encodeURIComponent(next));return}const p=await ArapongasDigitalAuth.ensureProfile(u);if(!p?.active)throw new Error('Perfil indisponível');statusEl.className='status ok';statusEl.textContent='Conta validada. O módulo de avaliações ainda não está liberado para publicação.';update()}catch{saveEl.disabled=true;statusEl.textContent='Não foi possível validar sua conta. Entre novamente para continuar.'}}init()})();</script></body></html>
