<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Avaliar empresa • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:700px;margin:auto;padding:24px 16px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.stars{display:flex;gap:8px;margin:18px 0}.stars button{font-size:32px;border:0;background:transparent;cursor:pointer;color:#aab7c7}.stars button.on{color:#ffb000}textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:13px;padding:12px}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0}.save{margin-top:15px;background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}</style></head><body><main class="wrap"><a href="explorar.html" style="color:#0877ff;font-weight:850">← Explorar</a><section class="card"><span class="kicker">SUA EXPERIÊNCIA</span><h1>Avaliar empresa</h1><p>Compartilhe uma experiência útil para outros consumidores.</p><div class="status" id="status">Verificando sua conta...</div><div class="stars" id="stars" aria-label="Nota de 1 a 5"><button data-v="1">★</button><button data-v="2">★</button><button data-v="3">★</button><button data-v="4">★</button><button data-v="5">★</button></div><textarea id="comment" maxlength="1000" placeholder="Conte como foi sua experiência. Evite dados pessoais ou conteúdo ofensivo."></textarea><button class="save" disabled id="save">Publicar avaliação</button></section></main><script src="../js/auth.js"></script><script>let rating=0;document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.v);document.querySelectorAll('#stars button').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)<=rating))});async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next='+encodeURIComponent(location.pathname.split('/').pop()+location.search));return}status.innerHTML='<b>Conta autenticada.</b> A publicação será liberada após a validação segura do perfil e da empresa avaliada.'}catch{status.textContent='Não foi possível validar a sessão.'}}save.onclick=e=>e.preventDefault();init()</script></body></html>
