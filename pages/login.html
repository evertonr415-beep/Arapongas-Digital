<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow"><title>Entrar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{min-height:100vh;background:radial-gradient(circle at 80% 10%,#20a4ff55,transparent 25%),linear-gradient(145deg,#041431,#082a69);display:grid;place-items:center;padding:18px}.login{width:min(440px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 30px 80px #00102c66}.login .brand{color:#061a44;margin-bottom:25px}.login h1{font-size:31px;margin-bottom:6px}.login p{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}input:focus{border-color:#0877ff}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:#0877ff;color:#fff;font-weight:900;margin-top:18px}.submit:disabled{opacity:.65;cursor:wait}.links{display:flex;justify-content:space-between;margin-top:15px;font-size:12px;color:#0877ff}.msg{min-height:20px;margin-top:12px;font-size:12px}.msg.err{color:#a52b2b}.tabs{display:flex;background:#eef5ff;padding:4px;border-radius:12px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:850;color:#62738c}.tabs button.active{background:#fff;color:#0877ff;box-shadow:0 3px 12px #16355f18}.signup{display:none}</style></head><body><section class="login"><a class="brand" href="../index.html"><span class="mark">AD</span><span>Arapongas <b>Digital</b><small>Comércio local conectado</small></span></a><span class="kicker">CONTA ARAPONGAS DIGITAL</span><h1 id="title">Bem-vindo de volta</h1><p id="subtitle">Entre para acessar sua conta.</p><div class="tabs"><button type="button" id="tabIn" class="active">Entrar</button><button type="button" id="tabUp">Criar conta</button></div><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="seu@email.com"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="200" required placeholder="••••••••"><button class="submit" type="submit">Entrar</button></form><form id="signupForm" class="signup"><label for="name">Nome</label><input id="name" autocomplete="name" minlength="2" maxlength="160" required placeholder="Seu nome"><label for="newEmail">E-mail</label><input id="newEmail" type="email" autocomplete="email" maxlength="254" required placeholder="seu@email.com"><label for="newPassword">Senha</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="200" required placeholder="Mínimo 8 caracteres"><button class="submit" type="submit">Criar minha conta</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div><div class="links"><a href="../index.html">← Voltar ao portal</a><a href="planos.html">Sou comerciante</a></div></section><script src="../js/auth.js"></script><script>const $=id=>document.getElementById(id),msg=$('msg'),login=$('loginForm'),signup=$('signupForm'),tabIn=$('tabIn'),tabUp=$('tabUp'),title=$('title'),subtitle=$('subtitle'),email=$('email'),password=$('password'),name=$('name'),newEmail=$('newEmail'),newPassword=$('newPassword'),rawNext=new URLSearchParams(location.search).get('next')||'perfil.html';function safeNext(){try{const u=new URL(rawNext,location.href);return u.origin===location.origin&&u.pathname.startsWith(location.pathname.replace(/[^/]+$/,''))&&!u.pathname.includes('..')?u.pathname.split('/').pop()+(u.search||'')+(u.hash||''):'perfil.html'}catch{return'perfil.html'}}function setBusy(form,busy){const b=form.querySelector('.submit');b.disabled=busy;b.textContent=busy?(form===login?'Entrando...':'Criando conta...'):(form===login?'Entrar':'Criar minha conta')}function show(text,error=false){msg.textContent=text;msg.classList.toggle('err',error)}function mode(up){login.style.display=up?'none':'block';signup.style.display=up?'block':'none';tabIn.classList.toggle('active',!up);tabUp.classList.toggle('active',up);title.textContent=up?'Crie sua conta':'Bem-vindo de volta';subtitle.textContent=up?'Cadastre-se para salvar seus recursos no Arapongas Digital.':'Entre para acessar sua conta.';show('')}tabIn.onclick=()=>mode(false);tabUp.onclick=()=>mode(true);login.onsubmit=async e=>{e.preventDefault();if(!login.reportValidity())return;setBusy(login,true);show('Entrando...');try{await ArapongasDigitalAuth.signIn(email.value.trim(),password.value);location.replace(safeNext())}catch{show('Não foi possível entrar. Confira seu e-mail e senha e tente novamente.',true);setBusy(login,false)}};signup.onsubmit=async e=>{e.preventDefault();if(!signup.reportValidity())return;setBusy(signup,true);show('Criando conta...');try{await ArapongasDigitalAuth.signUp(name.value.trim(),newEmail.value.trim(),newPassword.value);location.replace(safeNext())}catch{show('Não foi possível criar a conta com esses dados. Verifique as informações e tente novamente.',true);setBusy(signup,false)}};</script></body></html>
