<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Entrar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{min-height:100vh;background:radial-gradient(circle at 80% 10%,#20a4ff55,transparent 25%),linear-gradient(145deg,#041431,#082a69);display:grid;place-items:center;padding:18px}.login{width:min(440px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 30px 80px #00102c66}.login .brand{color:#061a44;margin-bottom:25px}.login h1{font-size:31px;margin-bottom:6px}.login p{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}input:focus{border-color:#0877ff}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:#0877ff;color:#fff;font-weight:900;margin-top:18px}.links{display:flex;justify-content:space-between;margin-top:15px;font-size:12px;color:#0877ff}</style></head><body><section class="login"><a class="brand" href="../index.html"><span class="mark">AD</span><span>Arapongas <b>Digital</b><small>Comércio local conectado</small></span></a><span class="kicker">ACESSO</span><h1>Bem-vindo de volta</h1><p>Entre para gerenciar sua empresa ou acessar seus favoritos.</p><form id="loginForm"><label>E-mail</label><input type="email" autocomplete="email" required placeholder="seu@email.com"><label>Senha</label><input type="password" autocomplete="current-password" required placeholder="••••••••"><button class="submit" type="submit">Entrar</button></form><div class="links"><a href="#">Esqueci minha senha</a><a href="#">Criar conta</a></div></section><script>document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();alert('Interface pronta. A autenticação será ligada ao Neon Auth na etapa de integração segura.');});</script></body></html>
