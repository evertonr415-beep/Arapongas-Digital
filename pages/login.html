<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Entrar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{min-height:100vh;background:radial-gradient(circle at 80% 10%,#20a4ff55,transparent 25%),linear-gradient(145deg,#041431,#082a69);display:grid;place-items:center;padding:18px}.login{width:min(440px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 30px 80px #00102c66}.login .brand{color:#061a44;margin-bottom:25px}.login h1{font-size:31px;margin-bottom:6px}.login p{color:var(--muted)}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}input:focus{border-color:#0877ff}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:#0877ff;color:#fff;font-weight:900;margin-top:18px}.links{display:flex;justify-content:space-between;margin-top:15px;font-size:12px;color:#0877ff}.msg{min-height:20px;margin-top:12px;font-size:12px}.tabs{display:flex;background:#eef5ff;padding:4px;border-radius:12px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:850;color:#62738c}.tabs button.active{background:#fff;color:#0877ff;box-shadow:0 3px 12px #16355f18}.signup{display:none}</style></head><body><section class="login"><a class="brand" href="../index.html"><span class="mark">AD</span><span>Arapongas <b>Digital</b><small>Comércio local conectado</small></span></a><span class="kicker">CONTA ARAPONGAS DIGITAL</span><h1 id="title">Bem-vindo de volta</h1><p id="subtitle">Entre para gerenciar sua empresa ou acessar sua conta.</p><div class="tabs"><button id="tabIn" class="active">Entrar</button><button id="tabUp">Criar conta</button></div><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="seu@email.com"><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="••••••••"><button class="submit" type="submit">Entrar</button></form><form id="signupForm" class="signup"><label>Nome</label><input id="name" autocomplete="name" required placeholder="Seu nome"><label>E-mail</label><input id="newEmail" type="email" autocomplete="email" required placeholder="seu@email.com"><label>Senha</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo 8 caracteres"><button class="submit" type="submit">Criar minha conta</button></form><div class="msg" id="msg"></div><div class="links"><a href="../index.html">← Voltar ao portal</a><a href="planos.html">Sou comerciante</a></div></section><script src="../js/auth.js"></script><script>const msg=document.querySelector('#msg'),login=document.querySelector('#loginForm'),signup=document.querySelector('#signupForm');function mode(up){login.style.display=up?'none':'block';signup.style.display=up?'block':'none';tabIn.classList.toggle('active',!up);tabUp.classList.toggle('active',up);title.textContent=up?'Crie sua conta':'Bem-vindo de volta';subtitle.textContent=up?'Cadastre-se para usar os recursos do Arapongas Digital.':'Entre para gerenciar sua empresa ou acessar sua conta.';msg.textContent=''}tabIn.onclick=()=>mode(false);tabUp.onclick=()=>mode(true);login.onsubmit=async e=>{e.preventDefault();msg.textContent='Entrando...';try{await ArapongasDigitalAuth.signIn(email.value,password.value);msg.textContent='Acesso realizado. Redirecionando...';location.href='painel.html'}catch(err){msg.textContent='Não foi possível entrar: '+err.message}};signup.onsubmit=async e=>{e.preventDefault();msg.textContent='Criando conta...';try{await ArapongasDigitalAuth.signUp(name.value,newEmail.value,newPassword.value);msg.textContent='Conta criada. Você já pode acessar o Arapongas Digital.';setTimeout(()=>location.href='painel.html',700)}catch(err){msg.textContent='Não foi possível criar a conta: '+err.message}};</script></body></html>
