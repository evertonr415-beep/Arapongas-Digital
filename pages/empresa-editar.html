<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha loja • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:850px;margin:auto;padding:24px 16px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:850}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}textarea{min-height:100px}.wide{grid-column:1/-1}.save{border:0;background:#0877ff;color:#fff;border-radius:12px;padding:13px 18px;font-weight:900}.hint{color:var(--muted);font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="painel.html" style="color:#0877ff;font-weight:850">← Painel</a><div class="card"><span class="kicker">MINHA LOJA</span><h1>Dados da empresa</h1><p class="hint">Esta tela já define os campos da gestão. A gravação será habilitada somente após o usuário autenticado ser vinculado à empresa.</p><form class="grid" id="form"><label>Nome da empresa<input required placeholder="Nome público"></label><label>Categoria<select><option>Selecione</option><option>Alimentação</option><option>Mercados</option><option>Moda</option><option>Tecnologia</option><option>Automotivo</option><option>Casa e Construção</option><option>Saúde e Bem-estar</option><option>Serviços</option><option>Pet</option><option>Beleza</option></select></label><label class="wide">Descrição<textarea placeholder="Conte aos clientes o que sua empresa oferece"></textarea></label><label>WhatsApp<input inputmode="tel" placeholder="(43) 99999-9999"></label><label>Telefone<input inputmode="tel" placeholder="(43) 0000-0000"></label><label>Instagram<input placeholder="@suaempresa"></label><label>Site<input type="url" placeholder="https://"></label><label class="wide">Endereço<input placeholder="Rua, número, bairro"></label><div class="wide"><button class="save">Salvar alterações</button></div></form></div></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();alert('A gravação será liberada após a autenticação e o vínculo seguro do comerciante com a empresa.');}</script></body></html>
