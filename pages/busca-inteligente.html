<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="description" content="Busca inteligente para encontrar produtos, serviços e ofertas no comércio local de Arapongas."><title>Busca inteligente • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:850px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:26px;padding:28px}.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}.row{display:flex;gap:9px}.row input{flex:1;padding:15px;border:1px solid var(--line);border-radius:13px;font-size:16px}.row button{border:0;border-radius:13px;background:#0877ff;color:#fff;font-weight:900;padding:0 20px}.hint{color:var(--muted);margin-top:13px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #dbeaff;background:#f6faff;border-radius:999px;padding:8px 11px;font-size:13px}@media(max-width:600px){.row{flex-direction:column}.row button{padding:14px}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:850">← Início</a><section class="hero"><span class="eyebrow">ENCONTRE DO SEU JEITO</span><h1>Busca inteligente</h1><p>Escreva naturalmente o que você procura no comércio de Arapongas.</p></section><section class="box"><form class="row" id="form"><input id="q" maxlength="120" placeholder="Ex.: preciso de um celular em promoção"><button>Buscar</button></form><div class="chips"><span class="chip">lanche perto</span><span class="chip">oficina mecânica</span><span class="chip">roupa feminina</span><span class="chip">celular em promoção</span></div><p class="hint" id="hint">A interpretação acontece no próprio navegador e encaminha a consulta para a busca do catálogo.</p></section></main><script src="../js/smart-search.js"></script><script>const form=document.getElementById('form'),q=document.getElementById('q'),hint=document.getElementById('hint');document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.textContent;form.requestSubmit()});form.onsubmit=e=>{e.preventDefault();const p=ArapongasSmartSearch.parse(q.value);if(!p.terms.length){hint.textContent='Digite o que você está procurando.';return}location.href='explorar.html?q='+encodeURIComponent(p.terms.join(' '))+'&intent='+encodeURIComponent(p.intent)}</script></body></html>
