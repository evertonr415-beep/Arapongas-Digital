<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Minhas avaliações • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:900px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:24px;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}.empty{text-align:center;padding:35px;color:var(--muted)}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin-top:14px}.status.error{background:#fff0f0;color:#9b2525}.review-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stars{color:#ffb000;font-size:20px;letter-spacing:2px}.badge{font-size:12px;font-weight:850;border-radius:999px;padding:6px 9px;background:#eef5ff;color:#28527f}.badge.published{background:#eaf8ef;color:#176c38}.badge.rejected{background:#fff0f0;color:#9b2525}.comment{white-space:pre-wrap;overflow-wrap:anywhere;color:#30465f}.reply{margin-top:12px;border-left:3px solid #0877ff;padding:9px 12px;background:#f7faff;border-radius:8px}.meta{font-size:12px;color:var(--muted);margin-top:10px}</style></head><body><main class="wrap"><a href="perfil.html" style="color:#0877ff;font-weight:850">← Perfil</a><section class="hero"><span class="eyebrow">CONSUMIDOR</span><h1>Minhas avaliações</h1><p>Acompanhe as experiências que você compartilhou na plataforma.</p></section><div class="status" id="status" role="status" aria-live="polite">Verificando sua conta...</div><section id="list" aria-label="Histórico de avaliações"></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const statusEl=document.getElementById('status'),listEl=document.getElementById('list');const login=()=>location.replace('login.html?next='+encodeURIComponent('minhas-avaliacoes.html'));const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};const statusLabel=s=>s==='published'?'Publicada':s==='rejected'?'Não publicada':'Em moderação';const date=v=>{const d=new Date(v);return Number.isFinite(d.getTime())?new Intl.DateTimeFormat('pt-BR',{dateStyle:'medium',timeStyle:'short'}).format(d):''};function empty(){const card=node('section',null,'card empty');card.append(node('b','Você ainda não enviou avaliações'),node('p','Quando você avaliar uma empresa, o acompanhamento aparecerá aqui.'));listEl.replaceChildren(card)}function render(rows){listEl.replaceChildren();if(!rows.length){empty();return}for(const r of rows){const card=node('article',null,'card'),head=node('div',null,'review-head'),left=node('div'),stars=node('div','★'.repeat(Math.max(1,Math.min(5,Number(r.rating)||1))),'stars'),badge=node('span',statusLabel(String(r.status||'pending')),'badge '+String(r.status||'pending'));left.append(stars);head.append(left,badge);card.append(head);if(r.comment)card.append(node('p',String(r.comment).slice(0,1000),'comment'));if(r.merchant_reply){const reply=node('div',null,'reply');reply.append(node('b','Resposta da empresa'),node('div',String(r.merchant_reply).slice(0,2000)));card.append(reply)}const when=date(r.created_at);if(when)card.append(node('div','Enviada em '+when,'meta'));listEl.append(card)}}async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){login();return}const p=await ArapongasDigitalAuth.ensureProfile(u);if(!p?.active)throw new Error('Perfil indisponível');const rows=await ArapongasDigitalAuth.dataRequest('reviews',{query:'?select=id,profile_id,business_id,rating,comment,merchant_reply,status,created_at&profile_id=eq.'+encodeURIComponent(p.id)+'&order=created_at.desc&limit=100'});const own=Array.isArray(rows)?rows.filter(r=>r.profile_id===p.id):[];render(own);statusEl.textContent=own.length?`${own.length} avaliação${own.length===1?'':'ões'} encontrada${own.length===1?'':'s'}.`:'Seu histórico de avaliações está vazio.'}catch{statusEl.className='status error';statusEl.textContent='Não foi possível carregar suas avaliações. Entre novamente ou tente mais tarde.';listEl.replaceChildren()}}init()})();</script></body></html>
