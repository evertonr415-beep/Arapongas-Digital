<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Minhas avaliações • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:900px;margin:auto;padding:24px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:24px;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}.empty{text-align:center;padding:35px;color:var(--muted)}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin-top:14px}</style></head><body><main class="wrap"><a href="perfil.html" style="color:#0877ff;font-weight:850">← Perfil</a><section class="hero"><span class="eyebrow">CONSUMIDOR</span><h1>Minhas avaliações</h1><p>Acompanhe as experiências que você compartilhou na plataforma.</p></section><div class="status" id="status" role="status" aria-live="polite">Verificando sua conta...</div><section class="card"><div class="empty"><b>Avaliações protegidas</b><p>Seu histórico será carregado somente depois da validação do perfil autenticado.</p></div></section></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const statusEl=document.getElementById('status');const login=()=>location.replace('login.html?next='+encodeURIComponent('minhas-avaliacoes.html'));async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){login();return}statusEl.textContent='Conta autenticada. O histórico continuará isolado pelo seu perfil e será carregado somente após a validação segura do vínculo.'}catch{login()}}init()})();</script></body></html>
