<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Minha conta • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:760px;margin:auto;padding:28px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:26px;padding:28px}.card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.links a,.out,.save{padding:14px;border-radius:13px;font-weight:900;text-align:center}.links a{background:#eef5ff;color:#0877ff}.out{border:0;background:#061a44;color:#fff;width:100%;margin-top:15px}.save{border:0;background:#0877ff;color:#fff}.muted{color:var(--muted)}.form{display:grid;gap:12px}.form label{font-weight:800}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px}.status{font-size:14px;color:var(--muted)}@media(max-width:500px){.links{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:850">← Início</a><section class="hero"><span class="eyebrow">MINHA CONTA</span><h1 id="hello">Carregando...</h1><p>Seu espaço pessoal no Arapongas Digital.</p></section><section class="card" id="account"><p class="muted">Verificando sua sessão e seu perfil...</p></section><section class="card" id="editCard" hidden><h2>Dados do perfil</h2><form class="form" id="profileForm"><label>Nome<input id="fullName" maxlength="160" autocomplete="name"></label><label>Telefone<input id="phone" maxlength="30" inputmode="tel" autocomplete="tel"></label><button class="save" id="saveProfile" type="submit">Salvar alterações</button><div class="status" id="formStatus" role="status" aria-live="polite"></div></form></section><div class="links"><a href="favoritos.html">♡ Meus favoritos</a><a href="carrinho.html">🛒 Meu pedido</a><a href="minhas-avaliacoes.html">★ Minhas avaliações</a><a href="fidelidade.html">🎁 Clube de vantagens</a><a href="explorar.html">⌕ Explorar Arapongas</a><a href="planos.html">🏪 Área para empresas</a></div><button class="out" id="logout" hidden>Sair da conta</button></main><script src="../js/auth.js"></script><script>(()=>{'use strict';const helloEl=document.getElementById('hello'),accountEl=document.getElementById('account'),logoutEl=document.getElementById('logout'),editCard=document.getElementById('editCard'),form=document.getElementById('profileForm'),fullName=document.getElementById('fullName'),phone=document.getElementById('phone'),formStatus=document.getElementById('formStatus'),save=document.getElementById('saveProfile');let user=null,profile=null;function row(label,value){const d=document.createElement('div');d.className='row';const b=document.createElement('b');b.textContent=label;const s=document.createElement('span');s.textContent=value||'Não informado';d.append(b,s);return d}function render(){helloEl.textContent='Olá, '+(profile?.full_name||user?.name||'bem-vindo')+'!';const role={consumer:'Consumidor',merchant:'Comerciante',admin:'Administrador',superadmin:'Superadministrador'}[profile?.role]||'Consumidor';accountEl.replaceChildren(row('Nome',profile?.full_name||user?.name),row('E-mail',user?.email),row('Telefone',profile?.phone),row('Conta',role));fullName.value=profile?.full_name||user?.name||'';phone.value=profile?.phone||'';editCard.hidden=false;logoutEl.hidden=false}async function init(){try{const session=await ArapongasDigitalAuth.session();user=session?.user||session?.data?.user;if(!user){location.replace('login.html?next=perfil.html');return}profile=await ArapongasDigitalAuth.ensureProfile(user);if(!profile)throw new Error('Perfil não disponível');render()}catch(e){accountEl.replaceChildren();const p=document.createElement('p');p.className='muted';p.textContent='Sua sessão foi localizada, mas o perfil ainda não pôde ser sincronizado com segurança. Tente novamente após a publicação do ambiente autenticado.';const a=document.createElement('a');a.href='login.html';a.style='color:#0877ff;font-weight:900';a.textContent='Entrar novamente →';accountEl.append(p,a)}}form.addEventListener('submit',async e=>{e.preventDefault();save.disabled=true;formStatus.textContent='Salvando...';try{const updated=await ArapongasDigitalAuth.updateProfile({full_name:fullName.value,phone:phone.value});if(!updated)throw new Error('Sem retorno do perfil');profile={...profile,...updated};render();formStatus.textContent='Dados atualizados com segurança.'}catch{formStatus.textContent='Não foi possível salvar agora. Nenhuma permissão adicional foi concedida.'}finally{save.disabled=false}});logoutEl.addEventListener('click',async()=>{logoutEl.disabled=true;try{await ArapongasDigitalAuth.signOut()}finally{location.replace('../index.html')}});init()})();</script></body></html>
