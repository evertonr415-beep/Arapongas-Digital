<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Minha conta • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:760px;margin:auto;padding:28px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:26px;padding:28px}.card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.links a,.out{padding:14px;border-radius:13px;font-weight:900;text-align:center}.links a{background:#eef5ff;color:#0877ff}.out{border:0;background:#061a44;color:#fff;width:100%;margin-top:15px}.muted{color:var(--muted)}@media(max-width:500px){.links{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:850">← Início</a><section class="hero"><span class="eyebrow">MINHA CONTA</span><h1 id="hello">Carregando...</h1><p>Seu espaço pessoal no Arapongas Digital.</p></section><section class="card" id="account"><p class="muted">Verificando sua sessão...</p></section><div class="links"><a href="favoritos.html">♡ Meus favoritos</a><a href="carrinho.html">🛒 Meu pedido</a><a href="minhas-avaliacoes.html">★ Minhas avaliações</a><a href="fidelidade.html">🎁 Clube de vantagens</a><a href="explorar.html">⌕ Explorar Arapongas</a><a href="planos.html">🏪 Área para empresas</a></div><button class="out" id="logout" hidden>Sair da conta</button></main><script src="../js/auth.js"></script><script>const helloEl=document.getElementById('hello'),accountEl=document.getElementById('account'),logoutEl=document.getElementById('logout');function row(label,value){const d=document.createElement('div');d.className='row';const b=document.createElement('b');b.textContent=label;const s=document.createElement('span');s.textContent=value||'Não informado';d.append(b,s);return d}async function init(){try{const session=await ArapongasDigitalAuth.session(),user=session?.user||session?.data?.user;if(!user){location.replace('login.html?next=perfil.html');return}helloEl.textContent='Olá, '+(user.name||'bem-vindo')+'!';accountEl.replaceChildren(row('Nome',user.name),row('E-mail',user.email),row('Conta','Consumidor'));logoutEl.hidden=false;logoutEl.onclick=async()=>{await ArapongasDigitalAuth.signOut();location.replace('../index.html')}}catch{accountEl.replaceChildren();const p=document.createElement('p');p.className='muted';p.textContent='Não foi possível verificar sua conta. Entre novamente.';const a=document.createElement('a');a.href='login.html';a.style='color:#0877ff;font-weight:900';a.textContent='Entrar →';accountEl.append(p,a)}}init()</script></body></html>
