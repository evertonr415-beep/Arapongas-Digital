<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Minha conta • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:760px;margin:auto;padding:28px 16px 100px}.hero{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:26px;padding:28px}.card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.links a,.out{padding:14px;border-radius:13px;font-weight:900;text-align:center}.links a{background:#eef5ff;color:#0877ff}.out{border:0;background:#061a44;color:#fff;width:100%;margin-top:15px}.muted{color:var(--muted)}@media(max-width:500px){.links{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:850">← Início</a><section class="hero"><span class="eyebrow">MINHA CONTA</span><h1 id="hello">Carregando...</h1><p>Seu espaço pessoal no Arapongas Digital.</p></section><section class="card" id="account"><p class="muted">Verificando sua sessão...</p></section><div class="links"><a href="favoritos.html">♡ Meus favoritos</a><a href="carrinho.html">🛒 Meu pedido</a><a href="explorar.html">⌕ Explorar Arapongas</a><a href="planos.html">🏪 Área para empresas</a></div><button class="out" id="logout" hidden>Sair da conta</button></main><script src="../js/auth.js"></script><script>async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=perfil.html');return}hello.textContent=`Olá, ${u.name||'bem-vindo'}!`;account.innerHTML=`<div class="row"><b>Nome</b><span>${u.name||'Não informado'}</span></div><div class="row"><b>E-mail</b><span>${u.email||'Não informado'}</span></div><div class="row"><b>Conta</b><span>Consumidor</span></div>`;logout.hidden=false;logout.onclick=async()=>{await ArapongasDigitalAuth.signOut();location.replace('../index.html')}}catch(e){account.innerHTML='<p class="muted">Não foi possível verificar sua conta. Entre novamente.</p><a href="login.html" style="color:#0877ff;font-weight:900">Entrar →</a>'}}init()</script></body></html>
