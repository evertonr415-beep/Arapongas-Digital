<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Planos • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:1080px;margin:auto;padding:28px 16px 90px}.hero2{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:28px;padding:38px;text-align:center}.hero2 h1{font-size:42px;margin:8px}.hero2 p{color:#d3e5ff}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.plan{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.plan.featured{border:2px solid #0877ff;box-shadow:var(--shadow)}.price{font-size:31px;font-weight:950}.plan ul{padding-left:20px;color:var(--muted);line-height:1.9}.plan a{display:block;text-align:center;background:#0877ff;color:#fff;padding:12px;border-radius:12px;font-weight:900}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:760px){.plans{grid-template-columns:1fr}.hero2{padding:27px 16px}.hero2 h1{font-size:34px}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:800">← Arapongas Digital</a><section class="hero2"><span class="eyebrow">PARA EMPRESAS</span><h1>Sua vitrine digital em Arapongas</h1><p>Comece gratuitamente e evolua conforme seu catálogo e sua operação crescerem.</p></section><section class="plans" id="plans"><article class="plan"><h2>Carregando planos...</h2></article></section><p class="note">Os valores dos planos Profissional e Premium ainda serão definidos comercialmente. Nenhuma cobrança é realizada nesta versão.</p></main><script src="../js/api.js"></script><script>const A=ArapongasDigitalAPI;async function init(){try{const ps=await A.plans();plans.innerHTML=ps.map((p,i)=>`<article class="plan ${i===1?'featured':''}"><span class="kicker">${i===0?'COMECE AGORA':i===1?'PARA CRESCER':'MÁXIMO DESTAQUE'}</span><h2>${A.escape(p.name)}</h2><div class="price">${Number(p.price_monthly)===0&&p.name!=='Gratuito'?'A definir':Number(p.price_monthly)===0?'Grátis':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(p.price_monthly)+'/mês'}</div><ul><li>${p.product_limit?`Até ${Number(p.product_limit)} produtos`:'Catálogo sem limite definido'}</li><li>${p.featured_limit?`Até ${Number(p.featured_limit)} destaques`:'Vitrine comercial'}</li><li>${p.analytics?'Métricas avançadas':'Presença básica'}</li><li>${p.coupons?'Cupons e campanhas':'Contato direto'}</li></ul><a href="comerciante-inicio.html">Começar com este plano</a></article>`).join('')}catch{plans.innerHTML='<article class="plan"><h2>Planos indisponíveis</h2><p>Tente novamente em instantes.</p></article>'}}init()</script></body></html>
