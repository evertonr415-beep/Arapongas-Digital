<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="description" content="Conheça os planos para empresas no Arapongas Digital."><title>Planos • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>.wrap{max-width:1080px;margin:auto;padding:28px 16px 90px}.hero2{background:linear-gradient(135deg,#061a44,#0877ff);color:#fff;border-radius:28px;padding:38px;text-align:center}.hero2 h1{font-size:42px;margin:8px}.hero2 p{color:#d3e5ff}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.plan{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}.plan.featured{border:2px solid #0877ff;box-shadow:var(--shadow)}.price{font-size:31px;font-weight:950}.plan ul{padding-left:20px;color:var(--muted);line-height:1.9}.plan a{display:block;text-align:center;background:#0877ff;color:#fff;padding:12px;border-radius:12px;font-weight:900}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:760px){.plans{grid-template-columns:1fr}.hero2{padding:27px 16px}.hero2 h1{font-size:34px}}</style></head><body><main class="wrap"><a href="../index.html" style="color:#0877ff;font-weight:800">← Arapongas Digital</a><section class="hero2"><span class="eyebrow">PARA EMPRESAS</span><h1>Sua vitrine digital em Arapongas</h1><p>Comece gratuitamente e evolua conforme seu catálogo e sua operação crescerem.</p></section><section class="plans" id="plans"><article class="plan"><h2>Carregando planos...</h2></article></section><p class="note">Os valores dos planos Profissional e Premium ainda serão definidos comercialmente. Nenhuma cobrança é realizada nesta versão.</p></main><script src="../js/api.js"></script><script>const A=ArapongasDigitalAPI,plansEl=document.getElementById('plans'),money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});function li(text){const el=document.createElement('li');el.textContent=text;return el}function planCard(p,i){const article=document.createElement('article');article.className=`plan ${i===1?'featured':''}`;const kicker=document.createElement('span');kicker.className='kicker';kicker.textContent=i===0?'COMECE AGORA':i===1?'PARA CRESCER':'MÁXIMO DESTAQUE';const h2=document.createElement('h2');h2.textContent=p.name||'Plano';const price=document.createElement('div');price.className='price';const value=Number(p.price_monthly);price.textContent=value===0&&p.name!=='Gratuito'?'A definir':value===0?'Grátis':Number.isFinite(value)?`${money.format(value)}/mês`:'A definir';const ul=document.createElement('ul');ul.append(li(p.product_limit==null?'Catálogo sem limite definido':`Até ${Number(p.product_limit)} produtos`),li(p.featured_limit==null?'Destaques sem limite definido':Number(p.featured_limit)>0?`Até ${Number(p.featured_limit)} destaques`:'Sem destaques no plano'),li(p.analytics?'Métricas avançadas':'Presença básica'),li(p.coupons?'Cupons e campanhas':'Sem criação de cupons'));const a=document.createElement('a');a.href='comerciante-inicio.html';a.textContent='Começar com este plano';article.append(kicker,h2,price,ul,a);return article}async function init(){try{const ps=await A.plans();plansEl.replaceChildren(...ps.map(planCard));if(!ps.length)throw new Error('Nenhum plano disponível.')}catch{const article=document.createElement('article');article.className='plan';const h2=document.createElement('h2');h2.textContent='Planos indisponíveis';const p=document.createElement('p');p.textContent='Tente novamente em instantes.';article.append(h2,p);plansEl.replaceChildren(article)}}init()</script></body></html>
