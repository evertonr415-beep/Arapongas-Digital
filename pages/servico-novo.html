<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><title>Novo serviço • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:820px;margin:auto;padding:24px 16px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:850}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}textarea{min-height:110px}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="servicos.html" style="color:#0877ff;font-weight:850">← Serviços</a><section class="card"><span class="kicker">NOVO SERVIÇO</span><h1>Cadastre o que sua empresa faz</h1><div class="status" id="status">Verificando sua conta...</div><form class="grid" id="form"><label class="wide">Nome do serviço<input required placeholder="Ex.: Troca de pneus"></label><label>Categoria<select id="category" required><option value="">Carregando...</option></select></label><label>Preço a partir de<input type="number" min="0" step="0.01" placeholder="Opcional"></label><label>Duração aproximada<input type="number" min="1" step="1" placeholder="Minutos"></label><label class="wide">Descrição<textarea placeholder="Explique o serviço e o que está incluído"></textarea></label><label class="wide" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0"> Permitir solicitação de agendamento</label><div class="wide"><button class="save" disabled>Salvar serviço</button></div></form></section></main><script src="../js/auth.js"></script><script src="../js/api.js"></script><script>const A=ArapongasDigitalAPI;async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=servico-novo.html');return}const cats=await A.categories();category.innerHTML='<option value="">Selecione</option>'+cats.map(c=>`<option value="${c.id}">${A.escape(c.name)}</option>`).join('');status.innerHTML='<b>Conta autenticada.</b> A gravação será liberada somente para a empresa vinculada.'}catch{status.textContent='Não foi possível validar a sessão.'}}form.onsubmit=e=>e.preventDefault();init()</script></body></html>
