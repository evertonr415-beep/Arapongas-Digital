<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#061a44"><title>Novo serviço • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:820px;margin:auto;padding:24px 16px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;font-weight:850}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px}.wide{grid-column:1/-1}textarea{min-height:110px}.save{background:#0877ff;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:900}.save:disabled{opacity:.45}.status{background:#eef5ff;color:#28527f;border-radius:12px;padding:12px;margin:12px 0;font-size:12px}.status.ok{background:#eaf8ef;color:#176c38}.status.err{background:#fff0f0;color:#9a2525}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><a href="servicos.html" style="color:#0877ff;font-weight:850">← Serviços</a><section class="card"><span class="kicker">NOVO SERVIÇO</span><h1>Cadastre o que sua empresa faz</h1><div class="status" id="status">Verificando sua empresa...</div><form class="grid" id="form"><label class="wide">Nome do serviço<input id="name" required maxlength="180" placeholder="Ex.: Troca de pneus"></label><label>Categoria<select id="category"><option value="">Carregando...</option></select></label><label>Preço a partir de<input id="price" type="number" min="0" step="0.01" placeholder="Opcional"></label><label>Duração aproximada<input id="duration" type="number" min="1" step="1" placeholder="Minutos"></label><label class="wide">Descrição<textarea id="description" maxlength="5000" placeholder="Explique o serviço e o que está incluído"></textarea></label><label class="wide" style="display:flex;gap:8px;align-items:center"><input id="appointment" type="checkbox" style="width:auto;margin:0"> Permitir solicitação de agendamento</label><div class="wide"><button class="save" id="save" disabled>Salvar serviço</button></div></form></section></main><script src="../js/auth.js"></script><script src="../js/api.js"></script><script>const $=id=>document.getElementById(id);let business=null;async function init(){try{const s=await ArapongasDigitalAuth.session(),u=s?.user||s?.data?.user;if(!u){location.replace('login.html?next=servico-novo.html');return}business=await ArapongasDigitalAuth.requireOwnBusiness();const cats=await ArapongasDigitalAPI.categories();$('category').replaceChildren(new Option('Selecione',''),...cats.map(c=>new Option(c.name,c.id)));$('status').className='status ok';$('status').textContent=`Empresa confirmada: ${business.name}. Cadastro liberado.`;$('save').disabled=false}catch(e){$('status').className='status err';$('status').textContent=e?.message||'Não foi possível validar sua empresa.'}}$('form').addEventListener('submit',async e=>{e.preventDefault();if(!business)return;$('save').disabled=true;$('status').className='status';$('status').textContent='Salvando serviço…';try{await ArapongasDigitalAuth.createService({name:$('name').value,category_id:$('category').value||null,price_from:$('price').value,duration_minutes:$('duration').value,description:$('description').value,appointment_enabled:$('appointment').checked,active:true});$('status').className='status ok';$('status').textContent='Serviço cadastrado com sucesso.';setTimeout(()=>location.replace('servicos.html'),500)}catch(err){$('status').className='status err';$('status').textContent=err?.message||'Não foi possível salvar.';$('save').disabled=false}});init()</script></body></html>
