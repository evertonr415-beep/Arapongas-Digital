<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex"><title>Compartilhar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:650px;margin:auto;padding:24px 16px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}.qr{width:280px;max-width:80%;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);margin:18px auto;display:block}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:#0877ff;color:#fff}.secondary{background:#eaf3ff;color:#061a44}.url{word-break:break-all;color:var(--muted);font-size:13px}</style></head><body><main class="wrap"><a href="javascript:history.back()" style="color:#0877ff;font-weight:850">← Voltar</a><section class="card"><span class="kicker">COMPARTILHE O COMÉRCIO LOCAL</span><h1>QR Code</h1><p>Abra a mesma página em outro celular ou envie para alguém.</p><img class="qr" id="qr" alt="QR Code para compartilhamento"><p class="url" id="url"></p><div class="actions"><button class="btn primary" id="share">Compartilhar</button><button class="btn secondary" id="copy">Copiar link</button></div></section></main><script src="../js/share.js"></script><script>const p=new URLSearchParams(location.search),target=p.get('url')||location.origin+'/',safe=(()=>{try{const u=new URL(target,location.origin);return ['http:','https:'].includes(u.protocol)?u.href:location.origin+'/'}catch{return location.origin+'/'}})();document.getElementById('url').textContent=safe;document.getElementById('qr').src=ArapongasDigitalShare.qrUrl(safe);document.getElementById('share').onclick=()=>ArapongasDigitalShare.share({url:safe});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(safe);document.getElementById('copy').textContent='Link copiado ✓'}catch{document.getElementById('copy').textContent='Não foi possível copiar'}}</script></body></html>
