<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a44"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><title>Compartilhar • Arapongas Digital</title><link rel="stylesheet" href="../assets/app.css"><style>body{background:#f3f7fc}.wrap{max-width:650px;margin:auto;padding:24px 16px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}.qr{width:280px;max-width:80%;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);margin:18px auto;display:block}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:#0877ff;color:#fff}.secondary{background:#eaf3ff;color:#061a44}.url{word-break:break-all;color:var(--muted);font-size:13px}.note{background:#eef5ff;color:#28527f;border-radius:12px;padding:11px;font-size:12px}</style></head><body><main class="wrap"><button class="btn secondary" id="back" type="button">← Voltar</button><section class="card"><span class="kicker">COMPARTILHE O COMÉRCIO LOCAL</span><h1>QR Code</h1><p>Abra a mesma página em outro celular ou envie para alguém.</p><img class="qr" id="qr" alt="QR Code para compartilhamento" referrerpolicy="no-referrer"><p class="url" id="url"></p><p class="note" id="note" role="status" aria-live="polite">Por segurança, esta ferramenta gera QR Code somente para páginas do próprio Arapongas Digital.</p><div class="actions"><button class="btn primary" id="share" type="button">Compartilhar</button><button class="btn secondary" id="copy" type="button">Copiar link</button></div></section></main><script src="../js/share.js"></script><script>(()=>{'use strict';const params=new URLSearchParams(location.search),fallback=new URL('../index.html',location.href).href,raw=params.get('url')||fallback;function sameOrigin(value){const href=ArapongasDigitalShare.safeUrl(value);if(!href)return fallback;try{const u=new URL(href);return u.origin===location.origin?u.href:fallback}catch{return fallback}}const target=sameOrigin(raw),urlEl=document.getElementById('url'),qrEl=document.getElementById('qr'),shareEl=document.getElementById('share'),copyEl=document.getElementById('copy'),backEl=document.getElementById('back'),noteEl=document.getElementById('note');urlEl.textContent=target;const qr=ArapongasDigitalShare.qrUrl(target);if(qr)qrEl.src=qr;else qrEl.hidden=true;shareEl.onclick=async()=>{const ok=await ArapongasDigitalShare.share({url:target});if(!ok)noteEl.textContent='Compartilhamento cancelado ou indisponível neste navegador.'};copyEl.onclick=async()=>{try{await navigator.clipboard.writeText(target);copyEl.textContent='Link copiado ✓'}catch{copyEl.textContent='Não foi possível copiar'}};backEl.onclick=()=>{if(history.length>1)history.back();else location.replace(fallback)}})();</script></body></html>
