name: Preview smoke checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            manifest.webmanifest
            sw.js
            vercel.json
            robots.txt
            assets/app.css
            assets/icon.svg
            js/api.js
            js/app.js
            js/auth.js
            pages/login.html
            pages/explorar.html
            pages/produto.html
            pages/empresa.html
            pages/painel.html
            pages/admin.html
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Validate JSON files
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null
      - name: Validate local HTML asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('.')
          failures = []
          attrs = re.compile(r'''(?:href|src)=["']([^"']+)["']''', re.I)
          for html in [root / 'index.html', *sorted((root / 'pages').glob('*.html'))]:
              text = html.read_text(encoding='utf-8')
              for ref in attrs.findall(text):
                  ref = ref.split('#', 1)[0].split('?', 1)[0].strip()
                  if not ref or ref.startswith(('http://','https://','mailto:','tel:','data:','javascript:','#')):
                      continue
                  target = (html.parent / ref).resolve() if not ref.startswith('/') else (root / ref.lstrip('/')).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      failures.append(f'{html}: reference escapes repository: {ref}')
                      continue
                  if not target.exists():
                      failures.append(f'{html}: missing local reference: {ref}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('Local HTML references OK')
          PY
      - name: Scan for obvious unresolved development markers
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(TODO|FIXME|localhost:[0-9]+|127\.0\.0\.1:[0-9]+)' index.html pages js assets manifest.webmanifest sw.js vercel.json robots.txt; then
            echo 'Unresolved development marker found.'
            exit 1
          fi
          echo 'No obvious unresolved development markers found.'
